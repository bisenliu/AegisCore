name: Setup Go
description: Check out the repository and install the pinned Go toolchain.

inputs:
  fetch-depth:
    description: Checkout history depth. Use 0 for a full history.
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        # 与 go.work / go.mod 中声明的工具链基线保持一致。
        go-version: '1.27.3'
        cache: true
        cache-dependency-path: |
          go.work
          go.work.sum
          **/go.mod
          **/go.sum
