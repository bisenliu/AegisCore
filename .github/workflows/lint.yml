name: quality

# 由顶层 CI 统一触发，避免同一 commit 重复执行标准质量门禁。
on:
  workflow_call:

permissions:
  contents: read

env:
  # renovate: datasource=go depName=github.com/golangci/golangci-lint/v2
  GOLANGCI_LINT_VERSION: 'v2.12.2'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # 与 go.work / go.mod 中声明的工具链基线保持一致。
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          installed_version="$(go version -m "$(go env GOPATH)/bin/golangci-lint" | awk '$1 == "mod" && $2 == "github.com/golangci/golangci-lint/v2" {print $3}')"
          test "${installed_version}" = "${GOLANGCI_LINT_VERSION}"
          golangci-lint version

      - name: Run lint
        run: make lint

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Run unit tests
        run: make test
