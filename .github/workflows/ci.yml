name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  quality:
    name: quality
    uses: ./.github/workflows/lint.yml

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Install architecture lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Run architecture and generation verification
        run: |
          make user-service-architecture-lint
          make user-service-openapi-generate
          git diff --exit-code

  container-test:
    name: container-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Run Docker-backed tests
        run: make test-containers

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Build binary
        run: make build

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: user-service-binary
          path: bin/user-service
          if-no-files-found: error
          retention-days: 7

  race:
    name: race (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - common
          - user-service
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Run race tests
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Generate coverage profiles
        run: ./scripts/check-coverage.sh

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profiles
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  govulncheck:
    name: govulncheck (${{ matrix.module.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: common
            path: common
          - name: user-service
            path: user-service
          - name: tools-openapi-convert
            path: tools/openapi-convert
          - name: tools-nacos-config-seed
            path: tools/nacos-config-seed
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run govulncheck
        working-directory: ${{ matrix.module.path }}
        run: govulncheck ./...

  gosec:
    name: gosec (${{ matrix.module.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: common
            path: common
          - name: user-service
            path: user-service
          - name: tools-openapi-convert
            path: tools/openapi-convert
          - name: tools-nacos-config-seed
            path: tools/nacos-config-seed
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Install gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run gosec high severity gate
        working-directory: ${{ matrix.module.path }}
        run: |
          mkdir -p "${{ github.workspace }}/security"
          gosec -severity high -fmt sarif -out "${{ github.workspace }}/security/gosec-${{ matrix.module.name }}.sarif" ./...

      - name: Upload gosec artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gosec-${{ matrix.module.name }}
          path: security/gosec-${{ matrix.module.name }}.sarif
          if-no-files-found: warn
          retention-days: 14

  trivy-filesystem:
    name: trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare security artifacts
        run: mkdir -p security

      - name: Generate filesystem scan report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .kilo,.kilocode,.agent,.gemini,.codegraph
          format: sarif
          output: security/trivy-filesystem.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Fail on high or critical filesystem findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .kilo,.kilocode,.agent,.gemini,.codegraph
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-setup-trivy: true

      - name: Upload filesystem scan artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-filesystem
          path: security/trivy-filesystem.sarif
          if-no-files-found: warn
          retention-days: 14

  user-service-image-security:
    name: user-service image security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare security artifacts
        run: mkdir -p security

      - name: Build user-service image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/docker/user-service.Dockerfile
          tags: aegiscore/user-service:sha-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=user-service-image
          cache-to: type=gha,scope=user-service-image,mode=max

      - name: Inspect image identity
        run: |
          docker image inspect "aegiscore/user-service:sha-${GITHUB_SHA}" --format 'image_ref=aegiscore/user-service:sha-'"${GITHUB_SHA}"' image_id={{.Id}} repo_digests={{join .RepoDigests ","}}' | tee security/user-service-image-identity.txt

      - name: Verify Distroless runtime contents
        run: ./deployments/docker/verify-user-service-image.sh "aegiscore/user-service:sha-${GITHUB_SHA}"

      - name: Generate image scan report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aegiscore/user-service:sha-${{ github.sha }}
          scanners: vuln
          format: sarif
          output: security/trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Generate repository SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: .kilo,.kilocode,.agent,.gemini,.codegraph
          format: cyclonedx
          output: security/sbom-repository.cdx.json
          skip-setup-trivy: true

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aegiscore/user-service:sha-${{ github.sha }}
          format: cyclonedx
          output: security/sbom-image.cdx.json
          skip-setup-trivy: true

      - name: Fail on high or critical image findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aegiscore/user-service:sha-${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-setup-trivy: true

      - name: Upload image scan and SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: user-service-image-security
          path: |
            security/user-service-image-identity.txt
            security/trivy-image.sarif
            security/sbom-repository.cdx.json
            security/sbom-image.cdx.json
          if-no-files-found: warn
          retention-days: 14
