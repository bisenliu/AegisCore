name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  quality:
    name: quality
    uses: ./.github/workflows/lint.yml

  github-actions-pins:
    name: github actions pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check external action pins
        run: make github-actions-pins-check

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Install architecture lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Run architecture and generation verification
        run: |
          make user-service-architecture-lint
          make user-service-openapi-generate
          git diff --exit-code

  delivery:
    name: delivery assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect delivery asset changes
        id: changes
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF}"
            git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
            changed_files="$(git diff --name-only "${base_ref}"...HEAD)"
          elif [[ -n "${GITHUB_EVENT_BEFORE:-}" && "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff --name-only "${GITHUB_EVENT_BEFORE}" "${GITHUB_SHA}")"
          else
            changed_files="__run_all__"
          fi

          if grep -Eq '^(deployments/|\.github/workflows/ci\.yml|Makefile|scripts/verify-delivery-assets\.sh)' <<<"${changed_files}" || [[ "${changed_files}" == "__run_all__" ]]; then
            echo 'run=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'run=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Install delivery verification tools
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

          helm_version='v3.19.2'
          helm_archive="helm-${helm_version}-linux-amd64.tar.gz"
          curl -fsSL "https://get.helm.sh/${helm_archive}" -o "/tmp/${helm_archive}"
          curl -fsSL "https://get.helm.sh/${helm_archive}.sha256sum" -o "/tmp/${helm_archive}.sha256sum"
          (cd /tmp && sha256sum -c "${helm_archive}.sha256sum")
          tar -xzf "/tmp/${helm_archive}" -C /tmp
          install /tmp/linux-amd64/helm "${HOME}/.local/bin/helm"

          kubectl_version='v1.34.1'
          curl -fsSLo "${HOME}/.local/bin/kubectl" "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          curl -fsSLo /tmp/kubectl.sha256 "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl.sha256"
          printf '%s  %s\n' "$(cat /tmp/kubectl.sha256)" "${HOME}/.local/bin/kubectl" | sha256sum -c -
          chmod +x "${HOME}/.local/bin/kubectl"

          kubeconform_version='v0.7.0'
          kubeconform_archive='kubeconform-linux-amd64.tar.gz'
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${kubeconform_version}/${kubeconform_archive}" -o "/tmp/${kubeconform_archive}"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${kubeconform_version}/CHECKSUMS" -o /tmp/kubeconform.CHECKSUMS
          grep 'kubeconform-linux-amd64.tar.gz$' /tmp/kubeconform.CHECKSUMS | sed 's#  #  /tmp/#' | sha256sum -c -
          tar -xzf "/tmp/${kubeconform_archive}" -C /tmp kubeconform
          install /tmp/kubeconform "${HOME}/.local/bin/kubeconform"

          prometheus_version='3.7.3'
          prometheus_archive="prometheus-${prometheus_version}.linux-amd64.tar.gz"
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${prometheus_version}/${prometheus_archive}" -o "/tmp/${prometheus_archive}"
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${prometheus_version}/sha256sums.txt" -o /tmp/prometheus.sha256sums.txt
          grep "prometheus-${prometheus_version}.linux-amd64.tar.gz$" /tmp/prometheus.sha256sums.txt | sed 's#  #  /tmp/#' | sha256sum -c -
          tar -xzf "/tmp/${prometheus_archive}" -C /tmp
          install "/tmp/prometheus-${prometheus_version}.linux-amd64/promtool" "${HOME}/.local/bin/promtool"

      - name: Verify delivery assets
        if: steps.changes.outputs.run == 'true'
        run: make delivery-verify

      - name: Skip delivery assets
        if: steps.changes.outputs.run != 'true'
        run: echo 'No delivery asset changes detected.'

  container-test:
    name: container-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Run Docker-backed tests
        run: make test-containers

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Build binary
        run: make build

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: user-service-binary
          path: bin/user-service
          if-no-files-found: error
          retention-days: 7

  race:
    name: race (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - common
          - user-service
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Run race tests
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Generate coverage profiles
        run: ./scripts/check-coverage.sh

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-profiles
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  govulncheck:
    name: govulncheck (${{ matrix.module.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: common
            path: common
          - name: user-service
            path: user-service
          - name: tools-openapi-convert
            path: tools/openapi-convert
          - name: tools-nacos-config-seed
            path: tools/nacos-config-seed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run govulncheck
        working-directory: ${{ matrix.module.path }}
        run: govulncheck ./...

  gosec:
    name: gosec (${{ matrix.module.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: common
            path: common
          - name: user-service
            path: user-service
          - name: tools-openapi-convert
            path: tools/openapi-convert
          - name: tools-nacos-config-seed
            path: tools/nacos-config-seed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod
            **/go.sum

      - name: Install gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run gosec high severity gate
        working-directory: ${{ matrix.module.path }}
        run: |
          mkdir -p "${{ github.workspace }}/security"
          gosec -severity high -fmt sarif -out "${{ github.workspace }}/security/gosec-${{ matrix.module.name }}.sarif" ./...

      - name: Upload gosec artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gosec-${{ matrix.module.name }}
          path: security/gosec-${{ matrix.module.name }}.sarif
          if-no-files-found: warn
          retention-days: 14

  trivy-filesystem:
    name: trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare security artifacts
        run: mkdir -p security

      - name: Generate filesystem scan report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .kilo,.kilocode,.agent,.gemini,.codegraph
          format: sarif
          output: security/trivy-filesystem.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Fail on high or critical filesystem findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .kilo,.kilocode,.agent,.gemini,.codegraph
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-setup-trivy: true

      - name: Upload filesystem scan artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-filesystem
          path: security/trivy-filesystem.sarif
          if-no-files-found: warn
          retention-days: 14

  user-service-image-security:
    name: user-service image security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Prepare security artifacts
        run: mkdir -p security

      - name: Build user-service image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deployments/docker/user-service.Dockerfile
          tags: aegiscore/user-service:sha-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=user-service-image
          cache-to: type=gha,scope=user-service-image,mode=max

      - name: Inspect image identity
        run: |
          docker image inspect "aegiscore/user-service:sha-${GITHUB_SHA}" --format 'image_ref=aegiscore/user-service:sha-'"${GITHUB_SHA}"' image_id={{.Id}} repo_digests={{join .RepoDigests ","}}' | tee security/user-service-image-identity.txt

      - name: Verify Distroless runtime contents
        run: ./deployments/docker/verify-user-service-image.sh "aegiscore/user-service:sha-${GITHUB_SHA}"

      - name: Generate image scan report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aegiscore/user-service:sha-${{ github.sha }}
          scanners: vuln
          format: sarif
          output: security/trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Generate repository SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: .kilo,.kilocode,.agent,.gemini,.codegraph
          format: cyclonedx
          output: security/sbom-repository.cdx.json
          skip-setup-trivy: true

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aegiscore/user-service:sha-${{ github.sha }}
          format: cyclonedx
          output: security/sbom-image.cdx.json
          skip-setup-trivy: true

      - name: Fail on high or critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aegiscore/user-service:sha-${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-setup-trivy: true

      - name: Upload image scan and SBOM artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: user-service-image-security
          path: |
            security/user-service-image-identity.txt
            security/trivy-image.sarif
            security/sbom-repository.cdx.json
            security/sbom-image.cdx.json
          if-no-files-found: warn
          retention-days: 14
