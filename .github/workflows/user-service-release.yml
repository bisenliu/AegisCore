name: user-service release

on:
  workflow_dispatch:
    inputs:
      image_repository:
        description: Immutable image repository without tag
        required: false
        default: ""
      deploy_to_cluster:
        description: Apply gated release to the configured Kubernetes cluster
        required: false
        type: boolean
        default: false
      kubernetes_namespace:
        description: Kubernetes namespace for the gated rollout
        required: false
        default: aegiscore
      migration_confirmation:
        description: Type migration-confirmed:<commit-sha> after the controlled migration record is complete
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-scan-render:
    name: build, scan, and render Helm release
    runs-on: ubuntu-latest
    if: ${{ github.ref_protected == true }}
    environment: user-service-release
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Crane
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - name: Prepare immutable image reference
        id: image
        env:
          RAW_IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        run: |
          release_repository="${RAW_IMAGE_REPOSITORY}"
          if [[ -z "${release_repository}" ]]; then
            release_repository="ghcr.io/${GITHUB_REPOSITORY_OWNER}/aegiscore/user-service"
          fi
          release_repository="$(printf '%s' "${release_repository}" | tr '[:upper:]' '[:lower:]')"
          repository_owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          allowed_repository="ghcr.io/${repository_owner}/aegiscore/user-service"

          if [[ "${release_repository}" != "${allowed_repository}" ]]; then
            printf 'image_repository must be %s\n' "${allowed_repository}" >&2
            exit 1
          fi

          if [[ ! "${release_repository}" =~ ^ghcr\.io/[a-z0-9][a-z0-9_.-]*/[a-z0-9][a-z0-9_.-]*/[a-z0-9][a-z0-9_.-]*$ ]]; then
            printf 'image_repository must be a lowercase GHCR repository without whitespace, protocol, or tag\n' >&2
            exit 1
          fi

          tag="sha-${GITHUB_SHA}"
          quarantine_repository="${release_repository}-quarantine"
          printf 'repository=%s\n' "${release_repository}" >> "${GITHUB_OUTPUT}"
          printf 'quarantine_repository=%s\n' "${quarantine_repository}" >> "${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"
          printf 'tagged_ref=%s:%s\n' "${release_repository}" "${tag}" >> "${GITHUB_OUTPUT}"
          printf 'quarantine_tagged_ref=%s:%s\n' "${quarantine_repository}" "${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build and push quarantined user-service image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deployments/docker/user-service.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.quarantine_tagged_ref }}
          cache-from: type=gha,scope=user-service-image-release
          cache-to: type=gha,scope=user-service-image-release,mode=max

      - name: Resolve quarantined image digest
        id: quarantine_digest
        run: |
          digest="$(docker buildx imagetools inspect "${{ steps.image.outputs.quarantine_tagged_ref }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          image_ref="${{ steps.image.outputs.quarantine_repository }}@${digest}"
          mkdir -p release
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          printf 'image_ref=%s\n' "${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Inspect quarantined image identity
        run: |
          docker buildx imagetools inspect "${{ steps.quarantine_digest.outputs.image_ref }}" | tee release/user-service-image-identity.txt

      - name: Pull quarantined image for runtime verification
        run: docker pull "${{ steps.quarantine_digest.outputs.image_ref }}"

      - name: Verify Distroless runtime contents
        run: ./deployments/docker/verify-user-service-image.sh "${{ steps.quarantine_digest.outputs.image_ref }}"

      - name: Generate image scan report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.quarantine_digest.outputs.image_ref }}
          scanners: vuln
          format: sarif
          output: release/trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.quarantine_digest.outputs.image_ref }}
          format: cyclonedx
          output: release/sbom-image.cdx.json
          skip-setup-trivy: true

      - name: Fail on high or critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.quarantine_digest.outputs.image_ref }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-setup-trivy: true

      - name: Promote verified image to release repository
        run: |
          crane auth login ghcr.io -u "${GITHUB_ACTOR}" -p "${{ secrets.GITHUB_TOKEN }}"
          crane copy "${{ steps.quarantine_digest.outputs.image_ref }}" "${{ steps.image.outputs.tagged_ref }}"

      - name: Resolve promoted image digest
        id: digest
        run: |
          digest="$(docker buildx imagetools inspect "${{ steps.image.outputs.tagged_ref }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ "${digest}" != "${{ steps.quarantine_digest.outputs.digest }}" ]]; then
            printf 'promoted digest %s does not match quarantined digest %s\n' "${digest}" "${{ steps.quarantine_digest.outputs.digest }}" >&2
            exit 1
          fi

          image_ref="${{ steps.image.outputs.repository }}@${digest}"
          printf 'IMAGE_REF=%s\n' "${image_ref}" | tee release/user-service-image-ref.env
          printf 'image_ref=%s\n' "${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Inspect promoted image identity
        run: |
          docker buildx imagetools inspect "${{ steps.digest.outputs.image_ref }}" | tee -a release/user-service-image-identity.txt

      - name: Render Helm release manifests
        run: |
          helm lint deployments/helm/aegiscore-user-service --set-string "image.ref=${{ steps.digest.outputs.image_ref }}"

          seed_suffix="rbac-seed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          helm template aegiscore-user-service deployments/helm/aegiscore-user-service \
            --values deployments/helm/aegiscore-user-service/values.yaml \
            --set-string "image.ref=${{ steps.digest.outputs.image_ref }}" \
            --set rbacSeedJob.enabled=true \
            --set-string "rbacSeedJob.nameSuffix=${seed_suffix}" \
            --show-only templates/rbac-seed-job.yaml \
            > release/aegiscore-user-service-rbac-seed.yaml

          helm template aegiscore-user-service deployments/helm/aegiscore-user-service \
            --values deployments/helm/aegiscore-user-service/values.yaml \
            --set-string "image.ref=${{ steps.digest.outputs.image_ref }}" \
            --set rbacSeedJob.enabled=false \
            > release/aegiscore-user-service-runtime.yaml

          if grep -q '^kind: Job$' release/aegiscore-user-service-runtime.yaml; then
            printf 'runtime manifest must not contain RBAC seed Job\n' >&2
            exit 1
          fi

          printf 'SEED_JOB_NAME=aegiscore-user-service-%s\n' "${seed_suffix}" | tee release/user-service-seed-job.env

      - name: Clean up quarantined image tag
        if: always() && steps.image.outputs.quarantine_tagged_ref != ''
        run: |
          crane auth login ghcr.io -u "${GITHUB_ACTOR}" -p "${{ secrets.GITHUB_TOKEN }}"
          crane delete "${{ steps.image.outputs.quarantine_tagged_ref }}" || true

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: user-service-release
          path: |
            release/user-service-image-ref.env
            release/user-service-image-identity.txt
            release/trivy-image.sarif
            release/sbom-image.cdx.json
            release/aegiscore-user-service-rbac-seed.yaml
            release/aegiscore-user-service-runtime.yaml
            release/user-service-seed-job.env
          if-no-files-found: warn
          retention-days: 30

  deploy-gated-release:
    name: deploy gated Kubernetes release
    runs-on: ubuntu-latest
    needs: build-scan-render
    if: ${{ github.ref_protected == true && inputs.deploy_to_cluster == true }}
    environment: user-service-release
    permissions:
      actions: read
      contents: read
    timeout-minutes: 30
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: user-service-release
          path: release

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Configure Kubernetes credentials
        run: |
          if [[ -z "${{ secrets.USER_SERVICE_RELEASE_KUBECONFIG_B64 }}" ]]; then
            printf 'USER_SERVICE_RELEASE_KUBECONFIG_B64 secret is required for deploy_to_cluster=true\n' >&2
            exit 1
          fi
          mkdir -p "${HOME}/.kube"
          printf '%s' "${{ secrets.USER_SERVICE_RELEASE_KUBECONFIG_B64 }}" | base64 -d > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Confirm controlled migration record
        run: |
          expected="migration-confirmed:${GITHUB_SHA}"
          if [[ "${{ inputs.migration_confirmation }}" != "${expected}" ]]; then
            printf 'migration_confirmation must be %s before rollout\n' "${expected}" >&2
            exit 1
          fi

          source release/user-service-image-ref.env
          printf 'Using release image %s after migration confirmation %s\n' "${IMAGE_REF}" "${expected}"

      - name: Run RBAC seed gate
        run: |
          source release/user-service-seed-job.env
          namespace="${{ inputs.kubernetes_namespace }}"
          kubectl apply -f release/aegiscore-user-service-rbac-seed.yaml -n "${namespace}"
          kubectl wait --for=condition=complete --timeout=15m "job/${SEED_JOB_NAME}" -n "${namespace}"

      - name: Roll out runtime manifest
        run: |
          namespace="${{ inputs.kubernetes_namespace }}"
          kubectl apply -f release/aegiscore-user-service-runtime.yaml -n "${namespace}"
          kubectl rollout status deployment/aegiscore-user-service -n "${namespace}" --timeout=10m
