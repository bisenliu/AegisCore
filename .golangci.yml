version: "2"

# 从 common/、user-service/ 和两个 tools/* 模块目录分别运行；根目录不是单一 Go module。
run:
  modules-download-mode: readonly
  tests: true

# 使用文本输出，便于本地终端和 CI 日志直接定位问题。
output:
  formats:
    text:
      path: stdout

linters:
  # standard 默认包含 errcheck、govet、staticcheck、unused 等基础高价值检查。
  default: standard
  enable:
    # revive 提供可配置的代码风格和常见问题检查。
    - revive
    # depguard 将 docs/ARCHITECTURE.md 中的分层依赖规则转为可执行 lint。
    - depguard
  # golangci-lint v2 将旧版独立的 gosimple/stylecheck analyzer family 合并到 staticcheck suite 中。
  settings:
    depguard:
      rules:
        feature-domain:
          files:
            - "**/internal/features/**/domain/*.go"
            - "**/internal/features/**/domain/**/*.go"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: domain must not depend on Gin transport
            - pkg: github.com/aegiscore/user-service/internal/persistence/ent$
              desc: domain must not depend on Ent persistence
            - pkg: github.com/aegiscore/user-service/internal/persistence/ent/
              desc: domain must not depend on Ent persistence
            - pkg: github.com/redis/go-redis/v9
              desc: domain must not depend on Redis clients
            - pkg: github.com/aegiscore/common/runtime/config
              desc: domain must not depend on runtime config
            - pkg: github.com/aegiscore/common/runtime/logger
              desc: domain must not depend on runtime logger
            - pkg: github.com/aegiscore/common/contract/response
              desc: domain must not depend on HTTP response envelopes
            - pkg: github.com/aegiscore/common/http/response
              desc: domain must not depend on HTTP response helpers
            - pkg: github.com/aegiscore/user-service/internal/features/auth/application$
              desc: domain must not depend on application ports
            - pkg: github.com/aegiscore/user-service/internal/features/auth/application/
              desc: domain must not depend on application code
            - pkg: github.com/aegiscore/user-service/internal/features/user/application$
              desc: domain must not depend on application ports
            - pkg: github.com/aegiscore/user-service/internal/features/user/application/
              desc: domain must not depend on application code
            - pkg: github.com/aegiscore/user-service/internal/features/role/application$
              desc: domain must not depend on application ports
            - pkg: github.com/aegiscore/user-service/internal/features/role/application/
              desc: domain must not depend on application code
            - pkg: github.com/aegiscore/user-service/internal/features/permission/application$
              desc: domain must not depend on application ports
            - pkg: github.com/aegiscore/user-service/internal/features/permission/application/
              desc: domain must not depend on application code
            - pkg: github.com/aegiscore/user-service/internal/features/auth/infrastructure$
              desc: domain must not depend on infrastructure adapters
            - pkg: github.com/aegiscore/user-service/internal/features/auth/infrastructure/
              desc: domain must not depend on infrastructure adapters
            - pkg: github.com/aegiscore/user-service/internal/features/user/infrastructure$
              desc: domain must not depend on infrastructure adapters
            - pkg: github.com/aegiscore/user-service/internal/features/user/infrastructure/
              desc: domain must not depend on infrastructure adapters
            - pkg: github.com/aegiscore/user-service/internal/features/role/infrastructure$
              desc: domain must not depend on infrastructure adapters
            - pkg: github.com/aegiscore/user-service/internal/features/role/infrastructure/
              desc: domain must not depend on infrastructure adapters
            - pkg: github.com/aegiscore/user-service/internal/features/permission/infrastructure$
              desc: domain must not depend on infrastructure adapters
            - pkg: github.com/aegiscore/user-service/internal/features/permission/infrastructure/
              desc: domain must not depend on infrastructure adapters
            - pkg: github.com/aegiscore/user-service/internal/features/auth/transport/http$
              desc: domain must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/auth/transport/http/
              desc: domain must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/user/transport/http$
              desc: domain must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/user/transport/http/
              desc: domain must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/role/transport/http$
              desc: domain must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/role/transport/http/
              desc: domain must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/permission/transport/http$
              desc: domain must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/permission/transport/http/
              desc: domain must not depend on HTTP transport DTO/controller packages
        feature-application:
          files:
            - "**/internal/features/**/application/*.go"
            - "**/internal/features/**/application/**/*.go"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: application must not depend on Gin transport
            - pkg: github.com/aegiscore/user-service/internal/persistence/ent$
              desc: application must not depend on Ent persistence
            - pkg: github.com/aegiscore/user-service/internal/persistence/ent/
              desc: application must not depend on Ent persistence
            - pkg: github.com/redis/go-redis/v9
              desc: application must not depend on Redis clients
            - pkg: github.com/aegiscore/common/http/binding
              desc: application must not depend on HTTP binder
            - pkg: github.com/aegiscore/user-service/internal/features/auth/transport/http$
              desc: application must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/auth/transport/http/
              desc: application must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/user/transport/http$
              desc: application must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/user/transport/http/
              desc: application must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/role/transport/http$
              desc: application must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/role/transport/http/
              desc: application must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/permission/transport/http$
              desc: application must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/permission/transport/http/
              desc: application must not depend on HTTP transport DTO/controller packages
        feature-transport-http:
          files:
            - "**/internal/features/**/transport/http/*.go"
            - "**/internal/features/**/transport/http/**/*.go"
          deny:
            - pkg: github.com/aegiscore/user-service/internal/persistence/ent$
              desc: HTTP transport must not depend on Ent persistence
            - pkg: github.com/aegiscore/user-service/internal/persistence/ent/
              desc: HTTP transport must not depend on Ent persistence
            - pkg: github.com/redis/go-redis/v9
              desc: HTTP transport must not depend on Redis clients
            - pkg: database/sql
              desc: HTTP transport must not depend on SQL packages
            - pkg: github.com/jackc/pgx/v5
              desc: HTTP transport must not depend on PostgreSQL driver packages
        feature-transport-grpc:
          files:
            - "**/internal/features/**/transport/grpc/*.go"
            - "**/internal/features/**/transport/grpc/**/*.go"
          deny:
            - pkg: github.com/aegiscore/user-service/internal/persistence/ent$
              desc: gRPC transport must not depend on Ent persistence
            - pkg: github.com/aegiscore/user-service/internal/persistence/ent/
              desc: gRPC transport must not depend on Ent persistence
            - pkg: github.com/redis/go-redis/v9
              desc: gRPC transport must not depend on Redis clients
            - pkg: database/sql
              desc: gRPC transport must not depend on SQL packages
            - pkg: github.com/jackc/pgx/v5
              desc: gRPC transport must not depend on PostgreSQL driver packages
            - pkg: github.com/gin-gonic/gin
              desc: gRPC transport must not depend on Gin transport
            - pkg: github.com/aegiscore/common/http/response
              desc: gRPC transport must not depend on HTTP response helpers
            - pkg: github.com/aegiscore/common/contract/response
              desc: gRPC transport must not depend on HTTP response envelopes
            - pkg: github.com/aegiscore/user-service/internal/integration$
              desc: gRPC transport must not depend on external integration adapters
            - pkg: github.com/aegiscore/user-service/internal/integration/
              desc: gRPC transport must not depend on external integration adapters
            - pkg: github.com/aegiscore/user-service/internal/features/auth/transport/http$
              desc: gRPC transport must not depend on HTTP controllers
            - pkg: github.com/aegiscore/user-service/internal/features/auth/transport/http/
              desc: gRPC transport must not depend on HTTP controllers
            - pkg: github.com/aegiscore/user-service/internal/features/user/transport/http$
              desc: gRPC transport must not depend on HTTP controllers
            - pkg: github.com/aegiscore/user-service/internal/features/user/transport/http/
              desc: gRPC transport must not depend on HTTP controllers
            - pkg: github.com/aegiscore/user-service/internal/features/role/transport/http$
              desc: gRPC transport must not depend on HTTP controllers
            - pkg: github.com/aegiscore/user-service/internal/features/role/transport/http/
              desc: gRPC transport must not depend on HTTP controllers
            - pkg: github.com/aegiscore/user-service/internal/features/permission/transport/http$
              desc: gRPC transport must not depend on HTTP controllers
            - pkg: github.com/aegiscore/user-service/internal/features/permission/transport/http/
              desc: gRPC transport must not depend on HTTP controllers
        feature-infrastructure:
          files:
            - "**/internal/features/**/infrastructure/*.go"
            - "**/internal/features/**/infrastructure/**/*.go"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: infrastructure must not depend on Gin transport
            - pkg: github.com/aegiscore/common/http/response
              desc: infrastructure must not depend on HTTP response helpers
            - pkg: github.com/aegiscore/common/contract/response
              desc: infrastructure must not depend on HTTP response envelopes
            - pkg: github.com/aegiscore/user-service/internal/features/auth/transport/http$
              desc: infrastructure must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/auth/transport/http/
              desc: infrastructure must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/user/transport/http$
              desc: infrastructure must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/user/transport/http/
              desc: infrastructure must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/role/transport/http$
              desc: infrastructure must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/role/transport/http/
              desc: infrastructure must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/permission/transport/http$
              desc: infrastructure must not depend on HTTP transport DTO/controller packages
            - pkg: github.com/aegiscore/user-service/internal/features/permission/transport/http/
              desc: infrastructure must not depend on HTTP transport DTO/controller packages
        integration-boundary:
          files:
            - "**/internal/integration/*.go"
            - "**/internal/integration/**/*.go"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: integration adapters must not depend on Gin transport
            - pkg: github.com/aegiscore/common/http/response
              desc: integration adapters must not depend on HTTP response helpers
            - pkg: github.com/aegiscore/common/contract/response
              desc: integration adapters must not depend on HTTP response envelopes
            - pkg: github.com/aegiscore/user-service/internal/persistence/ent$
              desc: integration adapters must not depend on Ent persistence
            - pkg: github.com/aegiscore/user-service/internal/persistence/ent/
              desc: integration adapters must not depend on Ent persistence
            - pkg: github.com/aegiscore/user-service/internal/features/auth/infrastructure$
              desc: integration adapters must not depend on feature persistence adapters
            - pkg: github.com/aegiscore/user-service/internal/features/auth/infrastructure/
              desc: integration adapters must not depend on feature persistence adapters
            - pkg: github.com/aegiscore/user-service/internal/features/user/infrastructure$
              desc: integration adapters must not depend on feature persistence adapters
            - pkg: github.com/aegiscore/user-service/internal/features/user/infrastructure/
              desc: integration adapters must not depend on feature persistence adapters
            - pkg: github.com/aegiscore/user-service/internal/features/role/infrastructure$
              desc: integration adapters must not depend on feature persistence adapters
            - pkg: github.com/aegiscore/user-service/internal/features/role/infrastructure/
              desc: integration adapters must not depend on feature persistence adapters
            - pkg: github.com/aegiscore/user-service/internal/features/permission/infrastructure$
              desc: integration adapters must not depend on feature persistence adapters
            - pkg: github.com/aegiscore/user-service/internal/features/permission/infrastructure/
              desc: integration adapters must not depend on feature persistence adapters
        auth-user-domain-boundary:
          files:
            - "**/internal/features/auth/*.go"
            - "**/internal/features/auth/**/*.go"
          deny:
            - pkg: github.com/aegiscore/user-service/internal/features/user/domain$
              desc: auth feature must use shared/identity instead of user domain
            - pkg: github.com/aegiscore/user-service/internal/features/user/domain/
              desc: auth feature must use shared/identity instead of user domain
        role-user-domain-boundary:
          files:
            - "**/internal/features/role/*.go"
            - "**/internal/features/role/**/*.go"
          deny:
            - pkg: github.com/aegiscore/user-service/internal/features/user/domain$
              desc: role feature must use shared/identity instead of user domain
            - pkg: github.com/aegiscore/user-service/internal/features/user/domain/
              desc: role feature must use shared/identity instead of user domain
        shared-boundary:
          files:
            - "**/internal/shared/*.go"
            - "**/internal/shared/**/*.go"
          deny:
            - pkg: github.com/aegiscore/user-service/internal/features/
              desc: shared packages must not depend on feature packages
            - pkg: github.com/gin-gonic/gin
              desc: shared packages must not depend on Gin transport
            - pkg: github.com/aegiscore/user-service/internal/persistence/ent$
              desc: shared packages must not depend on Ent persistence
            - pkg: github.com/aegiscore/user-service/internal/persistence/ent/
              desc: shared packages must not depend on Ent persistence
            - pkg: github.com/redis/go-redis/v9
              desc: shared packages must not depend on Redis clients
            - pkg: database/sql
              desc: shared packages must not depend on SQL packages
            - pkg: github.com/jackc/pgx/v5
              desc: shared packages must not depend on PostgreSQL driver packages
            - pkg: go.uber.org/fx
              desc: shared packages must not depend on Fx DI
            - pkg: github.com/aegiscore/common/http/response
              desc: shared packages must not depend on HTTP response helpers
            - pkg: github.com/aegiscore/common/contract/response
              desc: shared packages must not depend on HTTP response envelopes
            - pkg: github.com/aegiscore/common/runtime/config
              desc: shared packages must not depend on runtime config
            - pkg: github.com/aegiscore/common/runtime/logger
              desc: shared packages must not depend on runtime logger
            - pkg: github.com/aegiscore/common/runtime/datastore
              desc: shared packages must not depend on runtime datastore
        service-composition-boundary:
          files:
            - "**/cmd/*.go"
            - "**/cmd/**/*.go"
            - "**/internal/bootstrap/*.go"
            - "**/internal/bootstrap/**/*.go"
            - "**/internal/providers/*.go"
            - "**/internal/providers/**/*.go"
            - "**/internal/router/*.go"
            - "**/internal/router/**/*.go"
          deny:
            - pkg: github.com/aegiscore/user-service/internal/features/permission/infrastructure/casbin$
              desc: service composition must use permission public contracts instead of concrete policy sync adapters
            - pkg: github.com/aegiscore/user-service/internal/features/permission/infrastructure/casbin/
              desc: service composition must use permission public contracts instead of concrete policy sync adapters
            - pkg: github.com/aegiscore/user-service/internal/features/permission/infrastructure/redis$
              desc: service composition must use permission public contracts instead of concrete policy sync adapters
            - pkg: github.com/aegiscore/user-service/internal/features/permission/infrastructure/redis/
              desc: service composition must use permission public contracts instead of concrete policy sync adapters
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
  exclusions:
    generated: lax
    rules:
      # 测试中的 Close/Rollback 忽略通常不影响被测行为，避免产生低价值噪声。
      - linters:
          - errcheck
        path: (_test\.go)$
        text: Error return value.*(Close|Rollback)
    paths:
      # 排除 Ent 生成代码，但不排除 user-service/internal/persistence/ent/schema/ 下的 schema source。
      - (^|/)ent/(enttest|hook|migrate|predicate|runtime|user)(/|$)
      - (^|/)ent/(client|ent|mutation|runtime|tx|user|user_create|user_delete|user_query|user_update)\.go$
      - third_party$
      - builtin$
      - examples$

issues:
  # 不截断问题数量，首次接入时便于完整统计存量 lint findings。
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    # v2 中 gofmt/goimports 属于 formatter，而不是 linter。
    - gofmt
    - goimports
  settings:
    goimports:
      # 本地模块导入与第三方导入分组。
      local-prefixes:
        - github.com/aegiscore
  exclusions:
    generated: lax
    paths:
      # formatter 同样跳过 Ent 生成代码，避免对 codegen 输出产生噪声。
      - (^|/)ent/(enttest|hook|migrate|predicate|runtime|user)(/|$)
      - (^|/)ent/(client|ent|mutation|runtime|tx|user|user_create|user_delete|user_query|user_update)\.go$
      - third_party$
      - builtin$
      - examples$
