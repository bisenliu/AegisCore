app:
  name: aegiscore-user-services
  environment: local

http:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s
  trusted_proxies:
    - 127.0.0.1

log:
  level: info
  format: json
  directory: ./logs
  filename: aegiscore-user-services
  console: true
  max_age_days: 7
  max_size_mb: 100
  max_backups: 30

# Redis 基础连接模板
.redis_base: &redis_base
  addr: 127.0.0.1:6379
  username: ""
  password: ""
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

# PostgreSQL 基础连接模板
.postgres_base: &postgres_base
  host: 127.0.0.1
  port: 5432
  username: aegiscore
  password: aegiscore
  driver: pgx
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 30m
  conn_max_idle_time: 10m
  ping_timeout: 5s

redis:
  cache_redis:
    <<: *redis_base
    db: 0
  queue_redis:
    <<: *redis_base
    db: 1
    dial_timeout: 10s

postgres:
  user_db:
    <<: *postgres_base
    db_name: aegiscore_user
    max_open_conns: 50
  pay_db:
    <<: *postgres_base
    db_name: aegiscore_pay
  common_db:
    <<: *postgres_base
    db_name: aegiscore_common
