app:
  # 服务标识，用于日志、监控和后续服务治理区分实例来源。
  name: aegiscore-user-services
  # 当前运行环境；本地开发使用 local，部署环境可使用 dev/test/prod 等。
  environment: local

http:
  # HTTP 监听地址；容器内通常使用 0.0.0.0，对外暴露由网关或端口映射控制。
  host: 0.0.0.0
  # HTTP 监听端口；本地默认 8080，部署时可按服务端口规划调整。
  port: 8080

  # 读取请求头和请求体的最大耗时，避免慢请求长期占用连接。
  read_timeout: 10s
  # 写出响应的最大耗时，避免客户端读取过慢拖住服务端资源。
  write_timeout: 10s
  # keep-alive 空闲连接保留时间，超时后服务端主动关闭连接。
  idle_timeout: 60s
  # 服务停止时等待已有请求完成的最大耗时，超过后强制结束 shutdown。
  shutdown_timeout: 10s

  # Gin trusted proxies；生产环境应按真实反向代理或网关地址配置。
  trusted_proxies:
    # 本地回环代理地址；生产环境应替换为网关、Ingress 或负载均衡器地址段。
    - 127.0.0.1

log:
  # 日志最低输出级别；常用值为 debug、info、warn、error。
  level: info
  # 日志输出格式；支持 json/console，生产环境建议使用 json 便于采集检索。
  format: json

  # 日志文件输出目录；相对路径以服务启动工作目录为基准。
  directory: ./logs
  # 日志文件名前缀；common/logger 会按级别生成分类日志文件。
  filename: aegiscore-user-services

  # 是否同时输出到控制台；容器环境通常保留 true，便于日志采集。
  console: true

  # 日志文件最大保留天数，超过后由轮转逻辑清理。
  max_age_days: 7
  # 单个日志文件最大大小，单位 MB。
  max_size_mb: 100
  # 每类日志最多保留的历史备份文件数量。
  max_backups: 30

# Redis 基础连接模板。
# 具体实例通过 YAML merge 继承该模板，并覆盖 db、timeout 等差异字段。
.redis_base: &redis_base
  # Redis 服务地址，格式为 host:port。
  addr: 127.0.0.1:6379
  # Redis ACL 用户名；未启用 ACL 时保持为空。
  username: ""
  # Redis 密码；生产环境建议通过环境变量或 Secret 注入覆盖。
  password: ""

  # 建立 Redis TCP 连接的超时时间。
  dial_timeout: 5s
  # Redis 读操作超时时间。
  read_timeout: 3s
  # Redis 写操作超时时间。
  write_timeout: 3s

# PostgreSQL 基础连接模板。
# 具体数据库实例通过 YAML merge 继承该模板，并覆盖 db_name、连接池等差异字段。
.postgres_base: &postgres_base
  # PostgreSQL 主机名或服务发现地址。
  host: 127.0.0.1
  # PostgreSQL 监听端口。
  port: 5432
  # PostgreSQL 登录用户名。
  username: aegiscore
  # PostgreSQL 登录密码；生产环境建议通过环境变量或 Secret 注入覆盖。
  password: aegiscore
  # database/sql 使用的驱动名；当前项目使用 pgx stdlib 驱动。
  driver: pgx
  # PostgreSQL SSL 模式；本地开发通常为 disable，生产环境按数据库安全策略配置。
  sslmode: disable

  # 连接池最大打开连接数；高并发服务可按数据库容量和实例规格调整。
  max_open_conns: 25
  # 连接池最大空闲连接数；用于减少频繁建连成本。
  max_idle_conns: 5
  # 单个连接可复用的最长时间，超时后连接会被回收重建。
  conn_max_lifetime: 30m
  # 空闲连接可保留的最长时间，超时后空闲连接会被关闭。
  conn_max_idle_time: 10m
  # 服务启动时 ping 数据库的超时时间；超时会导致启动失败。
  ping_timeout: 5s

redis:
  # 用户服务当前声明并连接的缓存 Redis。
  cache_redis:
    <<: *redis_base
    # Redis logical database 编号；缓存实例默认使用 0。
    db: 0

  # 队列 Redis 示例配置；当前用户服务不会仅因配置存在而自动连接该实例。
  queue_redis:
    <<: *redis_base
    # Redis logical database 编号；队列示例使用 1，与缓存库隔离。
    db: 1
    # 覆盖基础模板中的建连超时，示例展示实例级配置可独立调整。
    dial_timeout: 10s

postgres:
  # 用户服务主业务库；用户 profile 查询通过该库访问 user 表。
  user_db:
    <<: *postgres_base
    # PostgreSQL 数据库名；该实例对应用户服务拥有的业务库。
    db_name: aegiscore_user
    # 覆盖基础模板中的最大连接数，用户主库可按访问量提升连接上限。
    max_open_conns: 50

  # 支付业务库示例配置；当前用户服务不会仅因配置存在而自动连接该实例。
  pay_db:
    <<: *postgres_base
    # PostgreSQL 数据库名；保留给后续支付服务或支付能力使用。
    db_name: aegiscore_pay

  # 公共业务库；当前用户服务声明该连接池，供跨域公共数据能力使用。
  common_db:
    <<: *postgres_base
    # PostgreSQL 数据库名；用于公共域或跨服务共享数据能力。
    db_name: aegiscore_common
