basePath: /api/v1
consumes:
- application/json
definitions:
  github_com_aegiscore_user-services_internal_dto.CreateUserRequest:
    properties:
      active:
        example: true
        type: boolean
      email:
        example: alice@example.com
        maxLength: 255
        type: string
      name:
        example: Alice
        maxLength: 128
        minLength: 1
        type: string
      password:
        example: secret
        minLength: 1
        type: string
    required:
    - email
    - name
    - password
    type: object
  github_com_aegiscore_user-services_internal_dto.LoginRequest:
    properties:
      email:
        example: alice@example.com
        maxLength: 255
        type: string
      password:
        example: secret
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  github_com_aegiscore_user-services_internal_dto.LogoutResponse:
    properties:
      logged_out:
        example: true
        type: boolean
    type: object
  github_com_aegiscore_user-services_internal_dto.RefreshTokenRequest:
    properties:
      refresh_token:
        example: eyJhbGciOi...
        minLength: 1
        type: string
    required:
    - refresh_token
    type: object
  github_com_aegiscore_user-services_internal_dto.TokenResponse:
    properties:
      access_token:
        example: eyJhbGciOi...
        type: string
      expires_in:
        example: 900
        type: integer
      refresh_token:
        example: eyJhbGciOi...
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  github_com_aegiscore_user-services_internal_dto.UserListResponseDoc:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_aegiscore_user-services_internal_dto.UserResponse'
        type: array
      pagination:
        $ref: '#/definitions/response.Pagination'
    type: object
  github_com_aegiscore_user-services_internal_dto.UserResponse:
    properties:
      active:
        example: true
        type: boolean
      created_at:
        example: 1780288800000
        type: integer
      email:
        example: alice@example.com
        type: string
      id:
        example: 123
        type: integer
      name:
        example: Alice
        type: string
      updated_at:
        example: 1780288800000
        type: integer
    type: object
  internal_router.HealthResponse:
    properties:
      service:
        example: aegiscore-user-services
        type: string
      status:
        example: ok
        type: string
    type: object
  response.Code:
    enum:
    - 0
    - 10000
    - 10001
    - 20000
    - 20001
    - 20002
    - 20003
    - 20004
    - 20005
    - 30000
    - 40000
    - 50000
    - 90000
    type: integer
    x-enum-varnames:
    - CodeOK
    - CodeBadRequest
    - CodeValidationFailed
    - CodeUnauthenticated
    - CodeTokenInvalid
    - CodeTokenExpired
    - CodeTokenRevoked
    - CodeMFARequired
    - CodeUserAccountLocked
    - CodeForbidden
    - CodeConflict
    - CodeNotFound
    - CodeInternalError
  response.Envelope:
    properties:
      code:
        $ref: '#/definitions/response.Code'
      data: {}
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  response.Pagination:
    properties:
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 128
        type: integer
      total_pages:
        example: 7
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: AegisCore 用户服务 API 文档，覆盖用户资料查询、用户创建和服务健康检查。
  title: AegisCore User Services API
  version: 1.0.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 校验用户邮箱和密码，创建可撤销会话并返回 Access Token 与 Refresh Token。
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_aegiscore_user-services_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_aegiscore_user-services_internal_dto.TokenResponse'
              type: object
        "400":
          description: 请求体错误或参数校验失败
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: 邮箱或密码错误
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      description: 删除当前会话的 Refresh Token 会话记录，不修改用户 token_version。
      produces:
      - application/json
      responses:
        "200":
          description: 退出成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_aegiscore_user-services_internal_dto.LogoutResponse'
              type: object
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: 退出当前设备
      tags:
      - 认证
  /auth/logout-all:
    post:
      description: 递增用户 token_version 并清理该用户所有 Refresh Token 会话。
      produces:
      - application/json
      responses:
        "200":
          description: 退出成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_aegiscore_user-services_internal_dto.LogoutResponse'
              type: object
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: 退出全部设备
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用仍有效且未撤销的 Refresh Token 换取新的 Access Token。
      parameters:
      - description: 刷新请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_aegiscore_user-services_internal_dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_aegiscore_user-services_internal_dto.TokenResponse'
              type: object
        "400":
          description: 请求体错误或参数校验失败
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Refresh Token 无效或会话已失效
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 刷新 Access Token
      tags:
      - 认证
  /healthz:
    get:
      description: 返回用户服务最小健康状态。
      produces:
      - application/json
      responses:
        "200":
          description: 服务健康
          schema:
            $ref: '#/definitions/internal_router.HealthResponse'
      summary: 服务健康检查
      tags:
      - 系统
  /users:
    get:
      description: 分页查询用户资料列表，支持按用户名、邮箱和启用状态过滤。分页参数未传或小于 1 时使用默认值 page=1、page_size=10。
      parameters:
      - description: 页码，未传或小于 1 时默认为 1
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 每页数量，未传或小于 1 时默认为 10
        in: query
        minimum: 1
        name: page_size
        type: integer
      - description: 用户名模糊匹配
        in: query
        name: name
        type: string
      - description: 邮箱精确匹配，服务端会转小写
        in: query
        name: email
        type: string
      - description: 是否启用
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_aegiscore_user-services_internal_dto.UserListResponseDoc'
              type: object
        "400":
          description: 查询参数错误
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: 分页查询用户列表
      tags:
      - 用户
    post:
      consumes:
      - application/json
      description: 创建一个新的用户资料。请求体使用共享校验器校验，邮箱必须唯一，active 缺省为 true。
      parameters:
      - description: 创建用户请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_aegiscore_user-services_internal_dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_aegiscore_user-services_internal_dto.UserResponse'
              type: object
        "400":
          description: 请求体错误或参数校验失败
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: 用户已存在
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - 用户
  /users/{id}:
    get:
      description: 通过正整数用户 ID 查询用户基础资料。
      parameters:
      - description: 用户ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_aegiscore_user-services_internal_dto.UserResponse'
              type: object
        "400":
          description: 用户 ID 参数错误
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: 查询用户资料
      tags:
      - 用户
produces:
- application/json
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 输入 Bearer token，格式为：Bearer <token>
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
