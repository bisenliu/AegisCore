basePath: /api/v1
consumes:
- application/json
definitions:
  github_com_aegiscore_user-services_internal_dto.CreateUserRequest:
    properties:
      active:
        example: true
        type: boolean
      email:
        example: alice@example.com
        maxLength: 255
        type: string
      name:
        example: Alice
        maxLength: 128
        minLength: 1
        type: string
    required:
    - email
    - name
    type: object
  github_com_aegiscore_user-services_internal_dto.UserResponse:
    properties:
      active:
        example: true
        type: boolean
      created_at:
        example: "2026-05-29T10:00:00Z"
        type: string
      email:
        example: alice@example.com
        type: string
      id:
        example: 123
        type: integer
      name:
        example: Alice
        type: string
      updated_at:
        example: "2026-05-29T10:00:00Z"
        type: string
    type: object
  internal_router.HealthResponse:
    properties:
      service:
        example: aegiscore-user-services
        type: string
      status:
        example: ok
        type: string
    type: object
  response.Code:
    enum:
    - 0
    - 10000
    - 10001
    - 20000
    - 20001
    - 20002
    - 30000
    - 40000
    - 50000
    - 90000
    type: integer
    x-enum-varnames:
    - CodeOK
    - CodeBadRequest
    - CodeValidationFailed
    - CodeUnauthenticated
    - CodeTokenInvalid
    - CodeTokenExpired
    - CodeForbidden
    - CodeConflict
    - CodeNotFound
    - CodeInternalError
  response.Envelope:
    properties:
      code:
        $ref: '#/definitions/response.Code'
      data: {}
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: AegisCore 用户服务 API 文档，覆盖用户资料查询、用户创建和服务健康检查。
  title: AegisCore User Services API
  version: 1.0.0
paths:
  /healthz:
    get:
      description: 返回用户服务最小健康状态。
      produces:
      - application/json
      responses:
        "200":
          description: 服务健康
          schema:
            $ref: '#/definitions/internal_router.HealthResponse'
      summary: 服务健康检查
      tags:
      - 系统
  /users:
    post:
      consumes:
      - application/json
      description: 创建一个新的用户资料。请求体使用共享校验器校验，邮箱必须唯一，active 缺省为 true。
      parameters:
      - description: 创建用户请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_aegiscore_user-services_internal_dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_aegiscore_user-services_internal_dto.UserResponse'
              type: object
        "400":
          description: 请求体错误或参数校验失败
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: 用户已存在
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - 用户
  /users/{id}:
    get:
      description: 通过正整数用户 ID 查询用户基础资料。
      parameters:
      - description: 用户ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_aegiscore_user-services_internal_dto.UserResponse'
              type: object
        "400":
          description: 用户 ID 参数错误
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: 查询用户资料
      tags:
      - 用户
produces:
- application/json
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 输入 Bearer token，格式为：Bearer <token>
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
