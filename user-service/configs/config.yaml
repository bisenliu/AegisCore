app:
  # 服务标识和部署环境会写入日志与 tracing resource attributes。
  name: aegiscore-user-service
  environment: local

runtime:
  lifecycle:
    # Fx App.Start 和 OnStart hooks 的启动总预算；不覆盖配置加载或 fx.New 同步构造。
    start_timeout: 60s
    # Fx app 关闭总预算，覆盖所有 OnStop hooks；必须大于等于 server.http/grpc.shutdown_timeout。
    # 该值不是数据可靠性保证，关键数据仍应通过持久化队列、WAL 或数据库状态恢复。
    stop_timeout: 120s
  gin:
    # Gin mode 是进程级设置；可通过 AEGISCORE_RUNTIME_GIN_MODE 覆盖。
    mode: release

server:
  http:
    # HTTP 是 user-service 当前唯一启用的入站协议。
    enabled: true
    host: 0.0.0.0
    port: 8080
    read_timeout: 30s
    write_timeout: 60s
    idle_timeout: 120s
    # HTTP server 组件级优雅关闭预算；必须小于等于 runtime.lifecycle.stop_timeout。
    shutdown_timeout: 25s
  grpc:
    # 当前没有入站 gRPC API；保留共享生命周期契约但默认关闭。
    enabled: false
    host: 127.0.0.1
    port: 9090
    shutdown_timeout: 10s

auth:
  jwt:
    # 仅供本地开发；生产环境必须通过 AEGISCORE_AUTH_JWT_SECRET 或 Secret 注入强随机值。
    secret: local-development-secret
    issuer: aegiscore-user-service
    audience: aegiscore-users
    access_token_ttl: 15m
    refresh_token_ttl: 168h
    password_change_token_ttl: 5m
  token_version_cache:
    enabled: true
    size: 100000
    ttl: 1s
    load_timeout: 300ms
  # Redis token_version 投影的业务缓存窗口；与进程内 token_version_cache 分开管理。
  token_version_cache_ttl: 30s
  refresh_token_rotation: true
  max_active_sessions_per_user: 5

rbac:
  user_role_cache:
    enabled: true
    size: 100000
    ttl: 5s
    load_timeout: 500ms

ent:
  sql_debug: false

log:
  # 日志只写 stdout/stderr；容器平台负责采集、保留和轮转。
  level: info
  format: json

observability:
  metrics:
    enabled: false
    path: /metrics
    include_runtime: true
  tracing:
    # 启用后固定通过 OTLP 导出；凭据由 Collector、sidecar 或平台传输层管理。
    enabled: false
    sample_ratio: 1.0
    otlp_endpoint: ""
    insecure: false
  pprof:
    # pprof 使用独立诊断 listener；生产类环境启用时必须绑定 loopback。
    enabled: false
    addr: 127.0.0.1:6060

resources:
  redis:
    cache_redis:
      addr: 127.0.0.1:6379
      username: ""
      # 本地无密码；生产通过 AEGISCORE_RESOURCES_REDIS_CACHE_REDIS_PASSWORD 或 Secret 注入。
      password: ""
      db: 0
      # 建连、读写和启动探测统一使用该超时。
      timeout: 5s
  postgres:
    primary_db:
      host: 127.0.0.1
      port: 5432
      username: aegiscore
      # 示例不承诺生产密码；本地按需用环境变量覆盖，生产必须由 Secret 注入。
      password: ""
      db_name: aegiscore_user
      sslmode: disable
      pool:
        max_open_conns: 50
        max_idle_conns: 10
        conn_max_lifetime: 30m
        conn_max_idle_time: 10m
