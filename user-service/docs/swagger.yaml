basePath: /api/v1
consumes:
- application/json
definitions:
  ChangePasswordRequest:
    properties:
      new_password:
        example: new-secret
        minLength: 1
        type: string
    required:
    - new_password
    type: object
  ChangePasswordResponse:
    properties:
      changed:
        example: true
        type: boolean
    type: object
  Code:
    enum:
    - 0
    - 10000
    - 10001
    - 20000
    - 20001
    - 20002
    - 20003
    - 20004
    - 20005
    - 30000
    - 40000
    - 50000
    - 90000
    type: integer
    x-enum-varnames:
    - CodeOK
    - CodeBadRequest
    - CodeValidationFailed
    - CodeUnauthenticated
    - CodeTokenInvalid
    - CodeTokenExpired
    - CodeTokenRevoked
    - CodeMFARequired
    - CodeUserAccountLocked
    - CodeForbidden
    - CodeConflict
    - CodeNotFound
    - CodeInternalError
  CreatePermissionRequest:
    properties:
      active:
        example: true
        type: boolean
      description:
        example: 允许分页查询用户资料
        maxLength: 512
        type: string
      http_method:
        example: GET
        type: string
      module:
        example: user
        maxLength: 64
        minLength: 1
        type: string
      name:
        example: 查询用户列表
        maxLength: 128
        minLength: 1
        type: string
      path_template:
        example: /api/v1/users
        type: string
      system:
        example: false
        type: boolean
    required:
    - http_method
    - module
    - name
    - path_template
    type: object
  CreateRoleRequest:
    properties:
      active:
        example: true
        type: boolean
      description:
        example: 管理后台角色
        maxLength: 512
        type: string
      name:
        example: 管理员
        maxLength: 128
        minLength: 1
        type: string
      system:
        example: false
        type: boolean
    required:
    - name
    type: object
  CreateUserRequest:
    properties:
      nickname:
        example: Alice
        maxLength: 128
        minLength: 1
        type: string
      password:
        example: secret
        minLength: 1
        type: string
      status:
        allOf:
        - $ref: '#/definitions/UserStatus'
        example: 100
      username:
        example: alice
        maxLength: 255
        minLength: 1
        type: string
    required:
    - nickname
    - password
    - username
    type: object
  DiscoveredRouteResponse:
    properties:
      http_method:
        example: GET
        type: string
      path:
        example: /api/v1/users
        type: string
    type: object
  Envelope:
    properties:
      code:
        $ref: '#/definitions/Code'
      data: {}
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  HealthResponse:
    properties:
      service:
        example: aegiscore-user-services
        type: string
      status:
        example: ok
        type: string
    type: object
  LoginRequest:
    properties:
      password:
        example: secret
        minLength: 1
        type: string
      username:
        example: alice
        maxLength: 255
        minLength: 1
        type: string
    required:
    - password
    - username
    type: object
  LogoutResponse:
    properties:
      logged_out:
        example: true
        type: boolean
    type: object
  Pagination:
    properties:
      has_next:
        example: true
        type: boolean
      next_cursor:
        example: 0190c8d2-8d8a-7a01-9f43-0f91fb4e2b7c
        type: string
      page_size:
        example: 50
        type: integer
    type: object
  PermissionIDBodyRequest:
    properties:
      permission_id:
        example: 018f6f3e-7c4d-7b2a-9f8a-4f6b1b2c3d4e
        type: string
    required:
    - permission_id
    type: object
  PermissionIDsRequest:
    properties:
      permission_ids:
        items:
          type: string
        type: array
    required:
    - permission_ids
    type: object
  PermissionListResponseDoc:
    properties:
      items:
        items:
          $ref: '#/definitions/PermissionResponse'
        type: array
      pagination:
        $ref: '#/definitions/Pagination'
    type: object
  PermissionResponse:
    properties:
      active:
        example: true
        type: boolean
      created_at:
        example: 1780288800000
        type: integer
      description:
        example: 允许分页查询用户资料
        type: string
      http_method:
        example: GET
        type: string
      module:
        example: user
        type: string
      name:
        example: 查询用户列表
        type: string
      path_template:
        example: /api/v1/users
        type: string
      permission_id:
        example: 018f6f3e-7c4d-7b2a-9f8a-4f6b1b2c3d4e
        type: string
      system:
        example: true
        type: boolean
      updated_at:
        example: 1780288800000
        type: integer
    type: object
  RefreshTokenRequest:
    properties:
      refresh_token:
        example: eyJhbGciOi...
        minLength: 1
        type: string
    required:
    - refresh_token
    type: object
  RoleIDBodyRequest:
    properties:
      role_id:
        example: 018f6f3e-7c4d-7b2a-9f8a-4f6b1b2c3d4e
        type: string
    required:
    - role_id
    type: object
  RoleIDsRequest:
    properties:
      role_ids:
        items:
          type: string
        type: array
    required:
    - role_ids
    type: object
  RoleListResponseDoc:
    properties:
      items:
        items:
          $ref: '#/definitions/RoleResponse'
        type: array
      pagination:
        $ref: '#/definitions/Pagination'
    type: object
  RoleResponse:
    properties:
      active:
        example: true
        type: boolean
      created_at:
        example: 1780288800000
        type: integer
      description:
        example: 管理后台角色
        type: string
      name:
        example: 管理员
        type: string
      role_id:
        example: 018f6f3e-7c4d-7b2a-9f8a-4f6b1b2c3d4e
        type: string
      system:
        example: false
        type: boolean
      updated_at:
        example: 1780288800000
        type: integer
    type: object
  RouteDiffResponse:
    properties:
      missing_in_permissions:
        items:
          $ref: '#/definitions/DiscoveredRouteResponse'
        type: array
      stale_permissions:
        items:
          $ref: '#/definitions/PermissionResponse'
        type: array
    type: object
  SetRoleStatusRequest:
    properties:
      active:
        example: true
        type: boolean
    type: object
  TokenResponse:
    properties:
      access_token:
        example: eyJhbGciOi...
        type: string
      expires_in:
        example: 900
        type: integer
      password_change_required:
        example: true
        type: boolean
      refresh_token:
        example: eyJhbGciOi...
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  UpdatePermissionRequest:
    properties:
      active:
        example: true
        type: boolean
      description:
        example: 允许分页查询用户资料
        maxLength: 512
        type: string
      http_method:
        example: GET
        type: string
      module:
        example: user
        maxLength: 64
        minLength: 1
        type: string
      name:
        example: 查询用户列表
        maxLength: 128
        minLength: 1
        type: string
      path_template:
        example: /api/v1/users
        type: string
    required:
    - http_method
    - module
    - name
    - path_template
    type: object
  UpdateRoleRequest:
    properties:
      active:
        example: true
        type: boolean
      description:
        example: 管理后台角色
        maxLength: 512
        type: string
      name:
        example: 管理员
        maxLength: 128
        minLength: 1
        type: string
    required:
    - name
    type: object
  UserListResponseDoc:
    properties:
      items:
        items:
          $ref: '#/definitions/UserResponseDoc'
        type: array
      pagination:
        $ref: '#/definitions/Pagination'
    type: object
  UserResponseDoc:
    properties:
      created_at:
        example: 1780288800000
        type: integer
      nickname:
        example: Alice
        type: string
      status:
        example: 100
        type: integer
      updated_at:
        example: 1780288800000
        type: integer
      user_id:
        example: 018f6f3e-7c4d-7b2a-9f8a-4f6b1b2c3d4e
        type: string
      username:
        example: alice
        type: string
    type: object
  UserStatus:
    enum:
    - 100
    - 200
    - 300
    format: int64
    type: integer
    x-enum-varnames:
    - UserStatusNormal
    - UserStatusDisabled
    - UserStatusMustChangePassword
host: localhost:8080
info:
  contact: {}
  description: AegisCore 用户服务 API 文档，覆盖认证会话、用户资料、角色管理、权限目录、RBAC 授权保护的业务接口和服务健康检查。
  title: AegisCore User Services API
  version: 1.0.0
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: 使用登录后返回的受限改密凭据修改密码，并将用户状态恢复为正常。
      parameters:
      - description: Bearer password-change-token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 修改密码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/ChangePasswordResponse'
              type: object
        "400":
          description: 请求体错误或参数校验失败
          schema:
            $ref: '#/definitions/Envelope'
        "401":
          description: 改密凭据无效或已失效
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/Envelope'
      summary: 修改密码
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      description: 校验用户名和密码，创建可撤销会话并返回 Access Token 与 Refresh Token。
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/TokenResponse'
              type: object
        "400":
          description: 请求体错误或参数校验失败
          schema:
            $ref: '#/definitions/Envelope'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/Envelope'
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      description: 删除当前会话的 Refresh Token 会话记录，不修改用户 token_version。
      produces:
      - application/json
      responses:
        "200":
          description: 退出成功
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/LogoutResponse'
              type: object
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 退出当前设备
      tags:
      - 认证
  /auth/logout-all:
    post:
      description: 递增用户 token_version 并清理该用户所有 Refresh Token 会话。
      produces:
      - application/json
      responses:
        "200":
          description: 退出成功
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/LogoutResponse'
              type: object
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 退出全部设备
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用仍有效且未撤销的 Refresh Token 换取新的 Access Token。
      parameters:
      - description: 刷新请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/TokenResponse'
              type: object
        "400":
          description: 请求体错误或参数校验失败
          schema:
            $ref: '#/definitions/Envelope'
        "401":
          description: Refresh Token 无效或会话已失效
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/Envelope'
      summary: 刷新 Access Token
      tags:
      - 认证
  /healthz:
    get:
      description: 返回用户服务最小健康状态。
      produces:
      - application/json
      responses:
        "200":
          description: 服务健康
          schema:
            $ref: '#/definitions/HealthResponse'
      summary: 服务健康检查
      tags:
      - 系统
  /permissions:
    get:
      description: 查询权限目录。业务接口由 JWT 和 RBAC 保护。
      parameters:
      - description: 分页游标
        in: query
        name: cursor
        type: string
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 模块
        in: query
        name: module
        type: string
      - description: HTTP 方法
        in: query
        name: http_method
        type: string
      - description: 是否启用
        in: query
        name: active
        type: boolean
      - description: 是否系统权限
        in: query
        name: system
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/PermissionListResponseDoc'
              type: object
        "400":
          description: 查询参数错误
          schema:
            $ref: '#/definitions/Envelope'
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/Envelope'
        "403":
          description: 无访问权限
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 分页查询权限
      tags:
      - 权限
    post:
      consumes:
      - application/json
      description: 创建正式权限目录记录。业务接口由 JWT 和 RBAC 保护。
      parameters:
      - description: 创建权限请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/PermissionResponse'
              type: object
        "400":
          description: 请求体错误或参数校验失败
          schema:
            $ref: '#/definitions/Envelope'
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/Envelope'
        "403":
          description: 无访问权限
          schema:
            $ref: '#/definitions/Envelope'
        "409":
          description: 权限已存在
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 创建权限
      tags:
      - 权限
  /permissions/{permission_id}:
    get:
      description: 通过权限 ID 查询权限目录记录。
      parameters:
      - description: 权限ID
        in: path
        name: permission_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/PermissionResponse'
              type: object
        "400":
          description: 权限 ID 参数错误
          schema:
            $ref: '#/definitions/Envelope'
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/Envelope'
        "403":
          description: 无访问权限
          schema:
            $ref: '#/definitions/Envelope'
        "404":
          description: 权限不存在
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 查询权限详情
      tags:
      - 权限
    put:
      consumes:
      - application/json
      description: 更新权限目录记录。系统权限身份字段受保护。
      parameters:
      - description: 权限ID
        in: path
        name: permission_id
        required: true
        type: string
      - description: 更新权限请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdatePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/PermissionResponse'
              type: object
        "400":
          description: 请求错误或系统权限受保护
          schema:
            $ref: '#/definitions/Envelope'
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/Envelope'
        "403":
          description: 无访问权限
          schema:
            $ref: '#/definitions/Envelope'
        "404":
          description: 权限不存在
          schema:
            $ref: '#/definitions/Envelope'
        "409":
          description: 权限已存在
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 更新权限
      tags:
      - 权限
  /permissions/{permission_id}/disable:
    post:
      description: 停用权限目录记录。停用后相关 RBAC 授权应被拒绝。
      parameters:
      - description: 权限ID
        in: path
        name: permission_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 停用成功
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/PermissionResponse'
              type: object
        "400":
          description: 权限 ID 参数错误
          schema:
            $ref: '#/definitions/Envelope'
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/Envelope'
        "403":
          description: 无访问权限
          schema:
            $ref: '#/definitions/Envelope'
        "404":
          description: 权限不存在
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 停用权限
      tags:
      - 权限
  /permissions/{permission_id}/enable:
    post:
      description: 启用权限目录记录。
      parameters:
      - description: 权限ID
        in: path
        name: permission_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 启用成功
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/PermissionResponse'
              type: object
        "400":
          description: 权限 ID 参数错误
          schema:
            $ref: '#/definitions/Envelope'
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/Envelope'
        "403":
          description: 无访问权限
          schema:
            $ref: '#/definitions/Envelope'
        "404":
          description: 权限不存在
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 启用权限
      tags:
      - 权限
  /permissions/route-diff:
    get:
      description: 只读比较 Gin 已注册业务路由和正式权限目录差异；不会创建权限，也不会绑定角色。
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/Envelope'
            - properties:
                data:
                  $ref: '#/definitions/RouteDiffResponse'
              type: object
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/Envelope'
        "403":
          description: 无访问权限
          schema:
            $ref: '#/definitions/Envelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/Envelope'
      security:
      - BearerAuth: []
      summary: 查询权限路由差异
      tags:
      - 权限
  /permissions/users/{user_id}/effective:
    get:
