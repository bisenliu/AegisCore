schema: spec-driven

context: |
  输出语言：简体中文。
  项目类型：Go 后端服务 workspace。
  技术栈：Go 1.26 workspace、toolchain go1.26.3、Gin HTTP、Cobra CLI、Uber Fx 依赖注入、Ent ORM、Atlas migration、PostgreSQL、Redis、Viper 配置、Zap 日志。
  模块边界：common 提供共享配置、Zap 日志、Redis/PostgreSQL 单实例创建能力、中间件、响应契约；user-services 提供用户服务运行时、用户资料查询 API、Ent schema 和服务内 Atlas migration。
  入口点：user-services/cmd/main.go；服务组装：user-services/internal/bootstrap/bootstrap.go；路由：user-services/internal/router/router.go。
  当前稳定能力：user-profile-query、http-service-runtime、shared-infrastructure、api-response-contract、database-schema-migrations、go-toolchain-baseline。
  生成代码规则：不要手写 user-services/ent/ 下的 Ent 生成代码；修改 user-services/ent/schema/ 后在 user-services 模块运行 go generate ./ent。
  API 规则：HTTP API 使用 common/response.Envelope 输出 success/code/message/data 信封。
  配置规则：运行时配置通过 YAML 和 AEGISCORE_ 环境变量覆盖加载，Redis/PostgreSQL 使用 redis.<name> 与 postgre.<name> 命名实例；common/config.Load 只读取、覆盖和反序列化，不执行 required/range 字段校验。
  日志规则：使用 Zap 和 trace-id；HTTP header 为 X-Trace-ID，日志字段为 trace-id，业务日志优先通过 common/logger context API 输出。

rules:
  proposal:
    - 明确说明变更涉及的 capability，并引用 docs/opsx/CAPABILITY_MAP.md 中的名称。
    - 区分目标和非目标，不要承诺当前没有代码基础的功能。
    - 如涉及外部可观察行为，说明 API、错误码、配置或数据模型兼容性影响。
  design:
    - 说明受影响的 Go 包、文件和分层边界。
    - 保持 controller/service/repository 分层：HTTP 解析在 controller，业务编排在 service，数据库访问在 repository。
    - 共享基础能力优先放在 common/，避免在 user-services 中重复实现响应、中间件或基础设施。
    - 涉及 Ent schema 时说明生成代码步骤，不要设计手动编辑生成代码。
    - 涉及数据库结构变更时说明 Atlas migration 生成、SQL review、atlas.sum 校验和部署前 apply 方式。
    - 评估启动依赖、数据库连接、Redis 连接、HTTP 响应契约和错误映射影响。
  tasks:
    - 任务应包含实现、测试、格式化和必要的 go generate 步骤。
    - 每个任务保持可独立验证，优先 1-2 小时粒度。
    - 涉及 API 变更时包含成功、参数错误、not found 和 internal error 验证。
    - 涉及配置或运行时时包含缺失配置、依赖不可用和优雅关闭验证。
    - 涉及 migration 时包含 migrate diff、SQL review、atlas migrate hash（如手工改 SQL）和 migrate validate 步骤。
    - 涉及 Go toolchain 时同步检查 go.work、common/go.mod、user-services/go.mod 和 docs/DEVELOPMENT.md。
  specs:
    - 主规格描述长期稳定 capability，不描述一次性重构或临时实现细节。
    - 使用 Given/When/Then 格式编写场景。
    - 覆盖主流程、异常流程和边界条件。
    - 使用当前真实代码行为作为事实来源，避免虚构尚未实现的认证、支付或管理能力。
    - 工具链、迁移、日志、配置加载策略属于长期能力时应进入主规格；被后续归档变更反转的旧决策不得作为当前事实。
