# OpenSpec 配置 - AegisCore

project:
  name: AegisCore
  description: "面向多服务后端能力的 Go 项目底座，当前包含共享基础模块和用户服务模块"
  language: Go
  version: "1.26"
  toolchain: go1.26.3

output:
  language: zh-CN
  spec_format: markdown
  scenario_format: given-when-then
  documentation_language: 简体中文
  openspec_language_policy: "openspec/specs、openspec/changes 和 docs/opsx 下的正文、标题、需求、场景、任务和说明必须使用简体中文；技术标识符可保留英文原文"
  code_comments: 中文
  log_messages: 英文
  log_fields: 稳定的英文 snake_case

tech_stack:
  runtime: "Go 1.26 workspace"
  workspace_modules:
    - common
    - user-service
  frameworks:
    - Gin
    - Uber Fx
    - Cobra
    - Ent
    - Atlas
    - Redis
    - PostgreSQL
    - Casbin
    - OpenTelemetry
    - Prometheus
  datastores:
    - PostgreSQL
    - Redis
  migration: "Ent schema + Atlas SQL migration"
  observability:
    - OpenTelemetry
    - Prometheus

design_rules:
  - "遵循 AGENTS.md、docs/ARCHITECTURE.md 和相关 openspec/specs"
  - "OpenSpec 主规格、change artifacts 和 OPSX 相关文档必须使用简体中文，禁止保留英文模板正文"
  - "服务内业务代码按 feature-first 组织，保持 domain、application、transport 和 infrastructure 分层"
  - "HTTP API 使用统一响应信封、错误码和分页契约"
  - "RBAC 授权由 permission feature 拥有，系统 RBAC 基线由 internal/shared/rbacbaseline 拥有"
  - "不得手动编辑 user-service/ent 生成代码或生成的 OpenAPI 工件，必须通过生成器更新"

tasks_rules:
  - "跨 feature、跨模块、目录结构、外部契约或稳定行为变更应先创建 OpenSpec change"
  - "生成或更新 proposal、design、tasks、spec.md 和 docs/opsx 文档时，必须将正文、标题、需求、场景和任务说明写为简体中文"
  - "实施 change 时必须包含 tasks.md，并按任务完成代码、文档和规格更新"
  - "变更后运行与范围匹配的 Makefile 入口；涉及 OpenAPI 时运行 make openapi-generate 并检查 drift"

docs:
  architecture: docs/ARCHITECTURE.md
  development: docs/DEVELOPMENT.md
  product: docs/PRODUCT.md
  testing: docs/TESTING.md
  capability_map: docs/opsx/CAPABILITY_MAP.md

specs_dir: openspec/specs
changes_dir: openspec/changes

apply:
  requires:
    - tasks
artifacts:
  proposal:
    path: proposal.md
  design:
    path: design.md
  tasks:
    path: tasks.md
