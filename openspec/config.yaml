schema: spec-driven

context: |
  项目：AegisCore。
  输出语言：简体中文。OpenSpec 主规格、change artifacts 和 OPSX 相关文档的正文、标题、需求、场景、任务和面向协作者的说明必须使用简体中文；技术术语、路径、命令、配置项名称、Go symbol、HTTP 方法和 OpenSpec 关键字可以保留英文原文。
  技术栈：Go 1.26 workspace、Gin、Fx、Ent、Atlas、PostgreSQL、Redis、Casbin、Prometheus、OpenTelemetry、Docker、Compose、Kubernetes、Helm。
  代码结构：common 为跨服务共享模块；user-service 为用户服务模块；deployments 为 Docker、Compose、Kubernetes、Helm、Prometheus 和 Grafana 资产；docs 为项目文档；openspec/specs 为主规格；openspec/changes 为待实施或待归档的 change artifacts。
  运行入口：user-service/cmd/main.go 提供 serve 和 rbac CLI；user-service/internal/router/router.go 挂载健康检查、OpenAPI、metrics、pprof、认证、权限、角色和用户 API。
  业务边界：auth 管理认证会话、强制改密、refresh session 和 token version；user 管理用户资料；permission 管理只读权限投影、授权中间件、Casbin policy loader、policy sync 和 outbox dispatcher；role 管理角色、角色权限、用户角色绑定、RBAC seed 和超级管理员绑定；common 维护跨服务契约和无业务语义 runtime primitive。
  结构边界：服务内业务代码按 feature-first 组织；user-service/internal/shared 当前只开放 identity 与 rbacbaseline；user-service/internal/integration 只承载真实外部系统防腐层；当前没有真实入站 gRPC、MQ/broker 或 eventbus，RBAC 事务 outbox 留在 role/permission feature 边界。
  运维边界：Ent schema 是数据库结构来源，Atlas SQL migration 是可审查迁移工件；生产优先通过独立 migration Job 或 CI/CD release job 在 HTTP rollout 前执行 migration，再执行 RBAC seed，最后滚动 HTTP 副本。
  常用验证：make test、make user-service-architecture-lint、make user-service-openapi-generate、make user-service-migrate-validate、make compose-dashboard-check。OpenSpec 流程全部完成后，先将本次预期代码和文档变更加到暂存区，再执行 make lint 和 make verify，避免 verify 的最终 git diff --exit-code 被未暂存的预期变更阻塞。

rules:
  proposal:
    - 必须说明 why、what changes、capabilities 和 impact。
    - capability 使用 kebab-case，并优先对应稳定业务能力，而不是临时实现任务或目录名。
    - 如果会影响 API、数据库 schema、OpenAPI、部署、观测、安全或共享契约，必须在 impact 中明确说明。
    - 不得把 OpenSpec instruction 的 context 或 rules 原文复制进 artifact 正文。
  specs:
    - 主规格描述长期稳定能力，change specs 描述本次 delta；不得把一次性重构任务伪装成 capability。
    - 每个 Requirement 必须至少包含一个 Scenario；复杂能力需要覆盖主流程、异常流程和边界条件。
    - OpenSpec delta 文件使用 CLI 要求的英文结构标记，例如 ADDED Requirements、Requirement、Scenario；场景内容使用中文。
    - 归档后的主规格正文使用中文结构，保留 Requirement 和 Scenario 关键字以满足 OpenSpec 解析。
    - 需求语句使用 MUST 或 SHALL 表达强约束；避免使用无法验证的泛化描述。
    - 新增或拆分 capability 前必须先检查 docs/opsx/CAPABILITY_MAP.md；能归入现有主规格时优先更新既有 capability，避免按临时目录名创建重复 spec。
    - 不得仅为了单元测试而要求或设计冗余生产代码；测试应基于现有实现和合理的可测试性设计，不引入与业务无关的额外逻辑、分支、接口或适配层。
  code:
    - 新增或修改 Go 导出类型、函数、方法、接口、常量、变量和包时，必须补充以被注释对象名称开头、语义准确且能通过 golint 风格检查的文档注释；已有注释不完整或与实现不一致时必须同步修正。
    - 对复杂逻辑、关键分支、边界条件、异常处理、并发操作、性能敏感路径和不易理解的实现，必须添加必要且简洁的行内注释；注释说明原因、约束或风险，避免重复代码本身。
    - 注释不得掩盖不清晰的实现；能通过更清晰命名、拆分职责或简化控制流解决的问题，应优先改进实现，再保留必要注释。
    - 代码注释和函数/方法注释使用中文；log message 使用英文，日志字段名使用稳定英文 `snake_case`。
  design:
    - 必须说明受影响路径、关键技术决策、备选方案、风险、回滚方式和验证方式。
    - 明确是否影响 Go 代码、HTTP API、数据库 migration、OpenAPI 生成物、部署清单、观测资产或安全边界。
    - 对跨模块 change，必须说明 common、user-service、deployments 和 docs/openspec 的同步关系。
    - 涉及 common、internal/shared、internal/integration、RBAC policy sync、数据库迁移、OpenAPI 生成或观测日志时，必须明确代码归属、不能放置的位置和验证方式。
    - 不写逐行实现细节；实现步骤放入 tasks。
  tasks:
    - 使用可解析的 `- [ ]` checkbox 格式，任务按 1-2 小时粒度拆分。
    - 任务必须按依赖顺序排列，并包含必要的文件产物、单元测试、暂存本次预期变更、`make lint` 和 `make verify` 验证命令。
    - OpenSpec 全部实现、规格和文档任务完成后，必须先将本次预期代码和文档变更加到暂存区，再执行 `make lint` 和 `make verify`；任一验证未通过或未运行时，不得把对应任务或 change 标记为完成。
    - 完成实现并通过要求的验证后，立即把对应 checkbox 改为 `- [x]`。
    - 涉及生成物的任务必须包含 drift 检查，例如 `git diff --exit-code` 或对应生成脚本的 `--check`。
