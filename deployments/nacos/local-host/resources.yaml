resources:
  redis:
    cache_redis:
      # mode 枚举：cluster=集群，standalone=非集群。
      # 默认 Compose 使用非集群 Redis；切换 Compose cluster command 时，同步改为下方 cluster 配置。
      mode: standalone
      addr: 127.0.0.1:6379
      username: ""
      password: ""
      timeout: 5s
      # Cluster 配置示例：
      # mode: cluster
      # addrs:
      #   - 127.0.0.1:16379
      # cluster:
      #   max_redirects: 8

  postgres:
    primary_db:
      host: 127.0.0.1
      port: 5432
      username: postgres
      password: ""
      db_name: aegiscore
      sslmode: disable
      pool:
        max_open_conns: 50
        max_idle_conns: 10
        conn_max_lifetime: 30m
        conn_max_idle_time: 10m
