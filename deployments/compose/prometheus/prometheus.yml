global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: aegiscore-user-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - user-service:8080
        labels:
          service: aegiscore-user-service
          environment: local
