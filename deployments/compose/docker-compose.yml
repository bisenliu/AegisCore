name: aegiscore-local

x-user-service-build: &user-service-build
  context: ../..
  dockerfile: deployments/docker/user-service.Dockerfile

x-user-service-configs: &user-service-configs
  - ./config/user-service.local.yaml:/app/user-service/configs/config.yaml:ro

services:
  postgres:
    # 本地开发跟随最新 PostgreSQL 镜像；正式环境建议固定具体版本或镜像 digest。
    image: postgres:latest
    user: postgres
    entrypoint: ["bash", "-euc"]
    command:
      - |
        data_dir=/var/lib/postgresql/data/pgdata
        if [ ! -s "$${data_dir}/PG_VERSION" ]; then
          mkdir -p "$${data_dir}"
          initdb -D "$${data_dir}" --username=postgres --auth-local=trust --auth-host=trust
        fi
        if ! grep -q '^host all all all trust$$' "$${data_dir}/pg_hba.conf"; then
          printf '\nhost all all all trust\n' >> "$${data_dir}/pg_hba.conf"
        fi
        exec postgres -D "$${data_dir}" -c listen_addresses=*
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - aegiscore-runtime
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:latest
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aegiscore-runtime
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    command:
      - --collector.otlp.enabled=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - aegiscore-observability
    restart: unless-stopped

  rbac-seed:
    profiles:
      - seed
    build: *user-service-build
    image: aegiscore-user-service:latest
    command:
      - rbac
      - --config
      - /app/user-service/configs/config.yaml
      - seed
      - --reactivate-system
      - --sync-system-bindings
    volumes: *user-service-configs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - aegiscore-runtime
      - aegiscore-observability
    restart: "no"

  user-service:
    build: *user-service-build
    image: aegiscore-user-service:latest
    command:
      - serve
      - --config
      - /app/user-service/configs/config.yaml
    volumes: *user-service-configs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - aegiscore-runtime
      - aegiscore-observability
    healthcheck:
      test: ["CMD", "/app/user-service/bin/user-service", "healthcheck", "--url", "http://127.0.0.1:8080/readyz", "--timeout", "3s"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/user-service-alerts.yaml:/etc/prometheus/rules/user-service-alerts.yaml:ro
    depends_on:
      user-service:
        condition: service_started
    networks:
      - aegiscore-observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    command:
      - --config=/etc/grafana/grafana.ini
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/aegiscore:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - aegiscore-observability
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  aegiscore-runtime:
    driver: bridge
  aegiscore-observability:
    driver: bridge
