name: aegiscore-local

x-user-service-build: &user-service-build
  context: ../..
  dockerfile: deployments/docker/user-service.Dockerfile

x-user-service-environment: &user-service-environment
  TZ: Asia/Shanghai
  AEGISCORE_APP_ENVIRONMENT: local
  OPENAPI_ENABLED: "true"
  AEGISCORE_SERVER_HTTP_ENABLED: "true"
  AEGISCORE_SERVER_HTTP_HOST: 0.0.0.0
  AEGISCORE_SERVER_HTTP_PORT: "8080"
  AEGISCORE_SERVER_HTTP_READ_TIMEOUT: 30s
  AEGISCORE_SERVER_HTTP_WRITE_TIMEOUT: 60s
  AEGISCORE_SERVER_HTTP_IDLE_TIMEOUT: 120s
  AEGISCORE_SERVER_HTTP_SHUTDOWN_TIMEOUT: 25s
  AEGISCORE_SERVER_GRPC_ENABLED: "false"
  AEGISCORE_SERVER_GRPC_HOST: 0.0.0.0
  AEGISCORE_SERVER_GRPC_PORT: "9090"
  AEGISCORE_SERVER_GRPC_SHUTDOWN_TIMEOUT: 10s
  AEGISCORE_AUTH_JWT_SECRET: ${AEGISCORE_AUTH_JWT_SECRET:?AEGISCORE_AUTH_JWT_SECRET is required}
  AEGISCORE_LOG_LEVEL: debug
  AEGISCORE_LOG_FORMAT: json
  AEGISCORE_AUTH_TOKEN_VERSION_CACHE_ENABLED: "true"
  AEGISCORE_AUTH_REFRESH_TOKEN_ROTATION: "true"
  AEGISCORE_RBAC_USER_ROLE_CACHE_ENABLED: "true"
  AEGISCORE_ENT_PLUGINS_SQL_LOG_ENABLED: "true"
  AEGISCORE_ENT_PLUGINS_SQL_LOG_DEBUG: "true"
  AEGISCORE_ENT_PLUGINS_TRACING_ENABLED: "true"
  AEGISCORE_ENT_PLUGINS_METRICS_ENABLED: "true"
  AEGISCORE_OBSERVABILITY_METRICS_ENABLED: "true"
  AEGISCORE_OBSERVABILITY_METRICS_PATH: /metrics
  AEGISCORE_OBSERVABILITY_METRICS_INCLUDE_RUNTIME: "true"
  AEGISCORE_OBSERVABILITY_TRACING_ENABLED: "true"
  AEGISCORE_OBSERVABILITY_TRACING_OTLP_ENDPOINT: jaeger:4317
  AEGISCORE_OBSERVABILITY_TRACING_INSECURE: "true"
  AEGISCORE_RESOURCES_REDIS_CACHE_REDIS_ADDR: redis:6379
  AEGISCORE_RESOURCES_REDIS_CACHE_REDIS_TIMEOUT: 5s
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_HOST: postgres
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_PORT: "5432"
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_USERNAME: aegiscore
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_DB_NAME: aegiscore_user
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_SSLMODE: disable
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_POOL_MAX_OPEN_CONNS: "50"
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_POOL_MAX_IDLE_CONNS: "10"
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_POOL_CONN_MAX_LIFETIME: 30m
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_POOL_CONN_MAX_IDLE_TIME: 10m

services:
  postgres:
    # 本地开发跟随最新 PostgreSQL 镜像；正式环境建议固定具体版本或镜像 digest，避免上游变更影响发布可重复性。
    image: postgres:latest
    environment:
      POSTGRES_USER: aegiscore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: aegiscore_user
      TZ: Asia/Shanghai
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - aegiscore-runtime
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegiscore -d aegiscore_user"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:latest
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aegiscore-runtime
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      TZ: Asia/Shanghai
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - aegiscore-observability
    restart: unless-stopped

  rbac-seed:
    profiles:
      - seed
    build: *user-service-build
    image: aegiscore-user-service:latest
    command:
      - rbac
      - --config
      - /app/user-service/configs/config.yaml
      - seed
      - --reactivate-system
      - --sync-system-bindings
    environment:
      <<: *user-service-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - aegiscore-runtime
      - aegiscore-observability
    restart: "no"

  user-service:
    build: *user-service-build
    image: aegiscore-user-service:latest
    environment:
      <<: *user-service-environment
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - aegiscore-runtime
      - aegiscore-observability
    healthcheck:
      test: ["CMD", "/app/user-service/bin/user-service", "healthcheck", "--url", "http://127.0.0.1:8080/readyz", "--timeout", "3s"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/user-service-alerts.yaml:/etc/prometheus/rules/user-service-alerts.yaml:ro
    depends_on:
      user-service:
        condition: service_started
    networks:
      - aegiscore-observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aegiscore/user-service-overview.json
      TZ: Asia/Shanghai
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/aegiscore:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - aegiscore-observability
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  aegiscore-runtime:
    driver: bridge
  aegiscore-observability:
    driver: bridge
