app:
  name: aegiscore-user-service
  environment: local

runtime:
  timezone: Asia/Shanghai
  lifecycle:
    start_timeout: 60s
    stop_timeout: 120s
  gin:
    mode: release

server:
  http:
    enabled: true
    host: 0.0.0.0
    port: 8080
    read_timeout: 30s
    write_timeout: 60s
    idle_timeout: 120s
    shutdown_timeout: 25s
  grpc:
    enabled: false
    host: 127.0.0.1
    port: 9090
    shutdown_timeout: 10s

auth:
  jwt:
    secret: compose-local-development-secret-value
    issuer: aegiscore-user-service
    audience: aegiscore-users
    access_token_ttl: 15m
    refresh_token_ttl: 168h
    password_change_token_ttl: 5m
  token_version_cache:
    enabled: true
    size: 100000
    ttl: 1s
    load_timeout: 300ms
  token_version_cache_ttl: 30s
  refresh_token_rotation: true
  max_active_sessions_per_user: 5

rbac:
  user_role_cache:
    enabled: true
    size: 100000
    ttl: 5s
    load_timeout: 500ms

ent:
  plugins:
    sql_log:
      enabled: true
      debug: true
    tracing:
      enabled: true
    metrics:
      enabled: true

log:
  level: debug
  format: json

observability:
  metrics:
    enabled: true
    path: /metrics
    include_runtime: true
  tracing:
    enabled: true
    sample_ratio: 1.0
    otlp_endpoint: jaeger:4317
    insecure: true
  pprof:
    enabled: false
    addr: 127.0.0.1:6060

resources:
  redis:
    cache_redis:
      addr: redis:6379
      username: ""
      password: ""
      db: 0
      timeout: 5s
  postgres:
    primary_db:
      host: postgres
      port: 5432
      username: postgres
      password: ""
      db_name: postgres
      sslmode: disable
      pool:
        max_open_conns: 50
        max_idle_conns: 10
        conn_max_lifetime: 30m
        conn_max_idle_time: 10m
