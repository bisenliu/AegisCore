# 本文件定义 user-service 数据库 migration 发布前置 Job。
# 适用于 HTTP Deployment rollout 前执行 Atlas SQL migration；成功后再执行 RBAC seed。
# Job 使用独立 Atlas/migration 镜像，并只依赖 `DATABASE_URL` Secret。
apiVersion: batch/v1 # Job 使用 batch/v1 API。
kind: Job # 声明一次性任务资源。
metadata: # Job 的元数据。
  name: aegiscore-user-services-migrate # Job 名称；发布脚本等待该 Job 完成。
  labels: # 资源标签，便于归类和查询。
    app.kubernetes.io/name: aegiscore-user-services # 应用名称标签。
    app.kubernetes.io/component: migration # 组件类型；migration 表示数据库迁移任务。
    app.kubernetes.io/part-of: aegiscore # 系统归属标签。
spec: # Job 执行规格。
  backoffLimit: 3 # 失败重试次数上限；超过后 Job 失败。
  activeDeadlineSeconds: 900 # Job 总运行时限，避免迁移长时间挂起。
  ttlSecondsAfterFinished: 86400 # 完成后保留 24 小时，便于查看日志和状态。
  template: # Job Pod 模板。
    metadata: # Job Pod 元数据。
      labels: # Pod 标签，便于日志查询。
        app.kubernetes.io/name: aegiscore-user-services # 应用名称标签。
        app.kubernetes.io/component: migration # 组件类型；用于区分运行时 Pod。
        app.kubernetes.io/part-of: aegiscore # 系统归属标签。
    spec: # Job Pod 规格。
      restartPolicy: Never # 失败由 Job 控制器重建 Pod，不在原 Pod 内重启容器。
      serviceAccountName: aegiscore-user-services # 使用与服务相同的最小权限身份。
      automountServiceAccountToken: false # 不挂载 API token，migration 不需要访问 Kubernetes API。
      securityContext: # Pod 级安全上下文。
        runAsNonRoot: true # 要求以非 root 用户运行。
        runAsUser: 10001 # 容器进程 UID；需与镜像用户兼容。
        runAsGroup: 10001 # 容器进程 GID。
        fsGroup: 10001 # 挂载卷所属组。
        seccompProfile: # seccomp 限制配置。
          type: RuntimeDefault # 使用运行时默认 seccomp profile。
      containers: # Job Pod 中的容器列表。
        - name: migrate # 容器名称。
          image: aegiscore-user-services-migration:latest # 示例 migration 镜像；生产应使用与服务同 release 的不可变镜像。
          imagePullPolicy: IfNotPresent # 本地已有镜像时不重复拉取；固定 tag 可改 Always。
          command: # 覆盖镜像默认入口，显式执行 Atlas migration。
            - /atlas # Atlas CLI。
            - migrate # migration 子命令。
            - apply # 应用已提交 SQL migration。
            - --config # 指定 Atlas 配置文件。
            - file://migrations/atlas.hcl # migration 镜像内的 Atlas 配置路径。
            - --env # 指定 Atlas 环境。
            - deploy # 使用 deploy 环境读取 DATABASE_URL。
          env: # Job 所需环境变量。
            - name: TZ # 容器时区环境变量。
              valueFrom: # 从 ConfigMap 读取值。
                configMapKeyRef: # ConfigMap 键引用。
                  name: aegiscore-user-services-config # ConfigMap 名称。
                  key: TZ # 时区键名。
            - name: DATABASE_URL # Atlas migration 所需 PostgreSQL URL。
              valueFrom: # 从 Secret 读取值。
                secretKeyRef: # Secret 键引用。
                  name: aegiscore-user-services-runtime # 运行时 Secret 名称。
                  key: DATABASE_URL # Secret 中的数据库 URL 键。
          resources: # migration 容器资源边界。
            requests: # 调度使用的资源请求。
              cpu: 100m # 请求 0.1 CPU。
              memory: 128Mi # 请求 128Mi 内存。
            limits: # 容器资源上限。
              cpu: 500m # 限制最多 0.5 CPU。
              memory: 512Mi # 限制最多 512Mi 内存。
          securityContext: # 容器级安全上下文。
            allowPrivilegeEscalation: false # 禁止提权。
            readOnlyRootFilesystem: true # 根文件系统只读。
            capabilities: # Linux capabilities 配置。
              drop: # 删除不需要的 capabilities。
                - ALL # 删除全部默认 capabilities。
          volumeMounts: # 容器挂载卷。
            - name: tmp # 引用下方 tmp emptyDir。
              mountPath: /tmp # 提供 Atlas 和 shell 临时文件路径。
      volumes: # Pod 级卷定义。
        - name: tmp # 临时卷名称。
          emptyDir: # Pod 生命周期内临时目录。
            sizeLimit: 128Mi # 限制临时目录容量。
