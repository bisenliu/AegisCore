# 本文件是 user-service 运行时 Secret 的键名示例。
# 适用于本地或临时环境快速对齐字段；生产环境应由外部密钥系统创建同名 Secret。
# 本文件不参与默认 kustomization，提交前必须替换示例值或改用安全的 Secret 注入流程。
apiVersion: v1 # Secret 属于 Kubernetes core/v1 API。
kind: Secret # 声明敏感键值资源。
metadata: # Secret 的元数据。
  name: aegiscore-user-services-runtime # Secret 名称；Deployment 和 seed Job 会引用它。
  namespace: aegiscore # 示例 Secret 所在 namespace；需与运行时资源一致。
  labels: # 资源标签，便于归类和查询。
    app.kubernetes.io/name: aegiscore-user-services # 应用名称标签。
    app.kubernetes.io/component: secret-example # 组件类型；标明这是示例 Secret。
    app.kubernetes.io/part-of: aegiscore # 系统归属标签。
type: Opaque # 通用 Secret 类型，适合保存应用自定义键值。
stringData: # 明文输入字段；提交到 API server 后会转为 base64 data。
  AEGISCORE_AUTH_JWT_SECRET: replace-with-a-strong-random-secret # JWT HMAC secret；生产必须使用高强度随机值。
  AEGISCORE_RESOURCES_POSTGRES_USER_DB_USERNAME: aegiscore # user_db PostgreSQL 用户名。
  AEGISCORE_RESOURCES_POSTGRES_USER_DB_PASSWORD: "" # 仅示例键；生产由 Secret 管理器注入真实密码。
  AEGISCORE_RESOURCES_REDIS_CACHE_REDIS_USERNAME: "" # Redis ACL 用户名；未启用 ACL 时可为空。
  AEGISCORE_RESOURCES_REDIS_CACHE_REDIS_PASSWORD: "" # Redis 密码；未启用密码时可为空。
