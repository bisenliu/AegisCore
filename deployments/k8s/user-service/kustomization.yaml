# 本文件是 user-service 原生 Kubernetes 清单的 Kustomize 入口。
# 适用于本地渲染、审查和环境发布前的完整资源集合校验。
# 关键资源包括 namespace、运行时 Deployment/Service、PDB、HPA 和 NetworkPolicy；RBAC seed Job 需在 rollout 前分阶段应用，运行配置由 AEGISCORE_* 环境变量定位 Nacos。
apiVersion: kustomize.config.k8s.io/v1beta1 # Kustomize 配置 API 版本，v1beta1 是当前通用入口。
kind: Kustomization # 声明这是一个 Kustomize 聚合配置。
namespace: aegiscore # 为未显式指定 namespace 的 namespaced 资源统一设置命名空间。
resources: # 参与默认渲染和应用的运行时资源文件列表；生产 seed Job 需按 README 单独执行。
  - namespace.yaml # 创建 AegisCore 运行命名空间。
  - serviceaccount.yaml # 创建 Pod 使用的 ServiceAccount 和最小 RBAC 占位。
  - service.yaml # 暴露集群内 HTTP Service。
  - deployment.yaml # 启动 user-service HTTP 副本；仅在 migration 和 RBAC seed 成功后应用。
  - pdb.yaml # 约束自愿驱逐时的最小可用性。
  - hpa.yaml # 按资源指标自动伸缩 HTTP 副本。
  - networkpolicy.yaml # 声明最小 ingress/egress 网络边界。
