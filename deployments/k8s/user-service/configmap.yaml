# 本文件定义 user-service 的非敏感运行时配置。
# 敏感配置必须放入 Secret；时区由平台标准 TZ 控制。
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegiscore-user-service-config
  labels:
    app.kubernetes.io/name: aegiscore-user-service
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: aegiscore
data:
  TZ: Asia/Shanghai # 平台级进程时区，不属于 AegisCore 配置树。
  AEGISCORE_APP_ENVIRONMENT: production
  AEGISCORE_SERVER_HTTP_ENABLED: "true"
  AEGISCORE_SERVER_HTTP_HOST: 0.0.0.0
  AEGISCORE_SERVER_HTTP_PORT: "8080"
  AEGISCORE_SERVER_HTTP_READ_TIMEOUT: 30s
  AEGISCORE_SERVER_HTTP_WRITE_TIMEOUT: 60s
  AEGISCORE_SERVER_HTTP_IDLE_TIMEOUT: 120s
  AEGISCORE_SERVER_HTTP_SHUTDOWN_TIMEOUT: 25s
  AEGISCORE_SERVER_GRPC_ENABLED: "false" # 当前没有入站 gRPC API。
  AEGISCORE_SERVER_GRPC_HOST: 127.0.0.1
  AEGISCORE_SERVER_GRPC_PORT: "9090"
  AEGISCORE_SERVER_GRPC_SHUTDOWN_TIMEOUT: 10s
  AEGISCORE_LOG_LEVEL: info
  AEGISCORE_LOG_FORMAT: json # 日志写 stdout/stderr，由平台采集和轮转。
  AEGISCORE_OBSERVABILITY_METRICS_ENABLED: "true"
  AEGISCORE_OBSERVABILITY_METRICS_PATH: /metrics
  AEGISCORE_OBSERVABILITY_METRICS_INCLUDE_RUNTIME: "true"
  AEGISCORE_OBSERVABILITY_TRACING_ENABLED: "false" # 启用后固定使用 OTLP。
  AEGISCORE_OBSERVABILITY_TRACING_OTLP_ENDPOINT: ""
  AEGISCORE_OBSERVABILITY_TRACING_INSECURE: "false"
  AEGISCORE_AUTH_JWT_ISSUER: aegiscore-user-service
  AEGISCORE_AUTH_JWT_AUDIENCE: aegiscore-users
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_HOST: postgres
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_PORT: "5432"
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_DB_NAME: aegiscore_user
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_SSLMODE: require
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_POOL_MAX_OPEN_CONNS: "50"
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_POOL_MAX_IDLE_CONNS: "10"
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_POOL_CONN_MAX_LIFETIME: 30m
  AEGISCORE_RESOURCES_POSTGRES_PRIMARY_DB_POOL_CONN_MAX_IDLE_TIME: 10m
  AEGISCORE_RESOURCES_REDIS_CACHE_REDIS_ADDR: redis:6379
  AEGISCORE_RESOURCES_REDIS_CACHE_REDIS_DB: "0"
  AEGISCORE_RESOURCES_REDIS_CACHE_REDIS_TIMEOUT: 5s
