# 本文件定义 user-service RBAC 系统数据 seed 发布前置 Job。
# 适用于 migration Job 成功之后、HTTP Deployment rollout 之前执行。
# Job 复用服务 Nacos 配置来源，执行 `rbac seed --reactivate-system --sync-system-bindings` 保持系统角色权限基线。
apiVersion: batch/v1 # Job 使用 batch/v1 API。
kind: Job # 声明一次性任务资源。
metadata: # Job 的元数据。
  name: aegiscore-user-service-rbac-seed # Job 名称；发布脚本等待该 Job 完成。
  labels: # 资源标签，便于归类和查询。
    app.kubernetes.io/name: aegiscore-user-service # 应用名称标签。
    app.kubernetes.io/component: rbac-seed # 组件类型；表示 RBAC seed 任务。
    app.kubernetes.io/part-of: aegiscore # 系统归属标签。
spec: # Job 执行规格。
  backoffLimit: 3 # 失败重试次数上限；超过后 Job 失败。
  activeDeadlineSeconds: 900 # Job 总运行时限，避免长时间挂起。
  ttlSecondsAfterFinished: 86400 # 完成后保留 24 小时，便于查看日志和状态。
  template: # Job Pod 模板。
    metadata: # Job Pod 元数据。
      labels: # Pod 标签，便于日志查询。
        app.kubernetes.io/name: aegiscore-user-service # 应用名称标签。
        app.kubernetes.io/component: rbac-seed # 组件类型；用于区分运行时 Pod。
        app.kubernetes.io/part-of: aegiscore # 系统归属标签。
    spec: # Job Pod 规格。
      restartPolicy: Never # 失败由 Job 控制器重建 Pod，不在原 Pod 内重启容器。
      serviceAccountName: aegiscore-user-service # 使用与服务相同的最小权限身份。
      automountServiceAccountToken: false # 不挂载 API token，seed 不需要访问 Kubernetes API。
      securityContext: # Pod 级安全上下文。
        runAsNonRoot: true # 要求以非 root 用户运行。
        runAsUser: 65532 # 容器进程 UID；与 Distroless nonroot 镜像身份一致。
        runAsGroup: 65532 # 容器进程 GID。
        fsGroup: 65532 # 挂载卷所属组。
        seccompProfile: # seccomp 限制配置。
          type: RuntimeDefault # 使用运行时默认 seccomp profile。
      containers: # Job Pod 中的容器列表。
        - name: rbac-seed # 容器名称。
          image: aegiscore-user-service:sha-local # 示例镜像；生产必须使用当前发布的不可变镜像。
          imagePullPolicy: IfNotPresent # 本地已有镜像时不重复拉取；固定 tag 可改 Always。
          command: # 覆盖镜像默认 CMD，执行 RBAC CLI。
            - /app/user-service/bin/user-service # user-service 二进制路径。
            - rbac # 进入 RBAC CLI 子命令。
            - seed # 执行系统 RBAC seed。
            - --reactivate-system # 重新启用 catalog 管理的系统角色和权限。
            - --sync-system-bindings # 同步系统角色权限绑定，使其与基线一致。
          env: # Nacos 配置来源选择环境变量；不覆盖业务字段。
            - name: AEGISCORE_SERVICE
              value: user-service
            - name: AEGISCORE_NACOS_ADDR
              value: nacos.prod.svc.cluster.local:8848
            - name: AEGISCORE_NACOS_NAMESPACE
              value: prod
            - name: AEGISCORE_NACOS_GROUP
              value: AEGISCORE
            - name: GOMEMLIMIT # Go GC 内存软上限；为 512Mi Job 容器限制预留非堆和运行时余量。
              value: 384MiB
          resources: # seed 容器资源边界。
            requests: # 调度使用的资源请求。
              cpu: 100m # 请求 0.1 CPU。
              memory: 128Mi # 请求 128Mi 内存。
            limits: # 容器资源上限。
              cpu: 500m # 限制最多 0.5 CPU。
              memory: 512Mi # 限制最多 512Mi 内存。
          securityContext: # 容器级安全上下文。
            allowPrivilegeEscalation: false # 禁止提权。
            readOnlyRootFilesystem: true # 根文件系统只读。
            capabilities: # Linux capabilities 配置。
              drop: # 删除不需要的 capabilities。
                - ALL # 删除全部默认 capabilities。
          volumeMounts: # 容器挂载卷。
            - name: tmp # 引用下方 tmp emptyDir。
              mountPath: /tmp # 提供日志和临时文件可写路径。
      volumes: # Pod 级卷定义。
        - name: tmp # 临时卷名称。
          emptyDir: # Pod 生命周期内临时目录。
            sizeLimit: 128Mi # 限制临时目录容量。
