# 本文件定义 user-service Pod 使用的 ServiceAccount 与最小 RBAC 占位。
# 适用于运行 HTTP 副本、migration Job 和 RBAC seed Job；默认不授予 Kubernetes API 权限。
# 后续若需要读取集群资源，应在本文件显式补充最小 Role 规则。
apiVersion: v1 # ServiceAccount 属于 Kubernetes core/v1 API。
kind: ServiceAccount # 声明 Pod 运行身份。
metadata: # ServiceAccount 的元数据。
  name: aegiscore-user-service # ServiceAccount 名称，Pod spec 会引用它。
  labels: # 资源标签，便于归类和查询。
    app.kubernetes.io/name: aegiscore-user-service # 应用名称标签。
    app.kubernetes.io/component: runtime # 组件类型；runtime 表示服务运行身份。
    app.kubernetes.io/part-of: aegiscore # 系统归属标签。
automountServiceAccountToken: false # 默认不挂载 API token，降低 Pod 凭据暴露面。
---
apiVersion: rbac.authorization.k8s.io/v1 # Role 使用 Kubernetes RBAC API。
kind: Role # 声明 namespace 级权限集合。
metadata: # Role 的元数据。
  name: aegiscore-user-service # Role 名称，与 ServiceAccount 保持一致。
  labels: # 资源标签，便于归类和查询。
    app.kubernetes.io/name: aegiscore-user-service # 应用名称标签。
    app.kubernetes.io/component: runtime # 组件类型；runtime 表示运行时权限。
    app.kubernetes.io/part-of: aegiscore # 系统归属标签。
rules: [] # 默认不授予任何权限；需要 API 访问时按最小权限追加规则。
---
apiVersion: rbac.authorization.k8s.io/v1 # RoleBinding 使用 Kubernetes RBAC API。
kind: RoleBinding # 声明将 Role 绑定到主体。
metadata: # RoleBinding 的元数据。
  name: aegiscore-user-service # RoleBinding 名称，与 Role 保持一致。
  labels: # 资源标签，便于归类和查询。
    app.kubernetes.io/name: aegiscore-user-service # 应用名称标签。
    app.kubernetes.io/component: runtime # 组件类型；runtime 表示运行时权限绑定。
    app.kubernetes.io/part-of: aegiscore # 系统归属标签。
subjects: # 被授予 Role 的主体列表。
  - kind: ServiceAccount # 主体类型；绑定给 Pod 使用的 ServiceAccount。
    name: aegiscore-user-service # 主体名称；必须与上方 ServiceAccount 一致。
roleRef: # 被引用的 Role。
  apiGroup: rbac.authorization.k8s.io # Role 所属 API group。
  kind: Role # 引用 namespace 级 Role。
  name: aegiscore-user-service # 引用的 Role 名称。
