# 本文件定义 user-service 的自愿驱逐预算。
# 适用于节点维护、集群升级和自动缩容场景，避免同时驱逐过多 HTTP 副本。
# 关键资源是 PodDisruptionBudget，仅选择 runtime Pod。
apiVersion: policy/v1 # PDB 使用 policy/v1 API。
kind: PodDisruptionBudget # 声明 Pod 自愿中断预算。
metadata: # PDB 的元数据。
  name: aegiscore-user-service # PDB 名称，与工作负载保持一致便于定位。
  labels: # 资源标签，便于筛选和归类。
    app.kubernetes.io/name: aegiscore-user-service # 应用名称标签。
    app.kubernetes.io/component: runtime # 组件类型；仅约束运行时副本。
    app.kubernetes.io/part-of: aegiscore # 系统归属标签。
spec: # PDB 约束规格。
  maxUnavailable: 1 # 自愿驱逐期间最多允许 1 个匹配 Pod 不可用。
  selector: # PDB 作用的 Pod 选择器。
    matchLabels: # 必须同时匹配以下标签。
      app.kubernetes.io/name: aegiscore-user-service # 匹配 user-service Pod。
      app.kubernetes.io/component: runtime # 排除 migration 和 seed Job Pod。
