{{- if .Values.rbacSeedJob.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" (include "aegiscore-user-service.fullname" .) .Values.rbacSeedJob.nameSuffix | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "aegiscore-user-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac-seed
    aegiscore.io/release-job-suffix: {{ .Values.rbacSeedJob.nameSuffix | quote }}
spec:
  backoffLimit: {{ .Values.rbacSeedJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.rbacSeedJob.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.rbacSeedJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "aegiscore-user-service.labels" . | nindent 8 }}
        app.kubernetes.io/component: rbac-seed
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "aegiscore-user-service.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: rbac-seed
          image: {{ include "aegiscore-user-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.rbacSeedJob.command | nindent 12 }}
          env:
            {{- include "aegiscore-user-service.nacosEnv" . | nindent 12 }}
            {{- with .Values.rbacSeedJob.goRuntime.gomemlimit }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.rbacSeedJob.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- toYaml .Values.rbacSeedJob.volumeMounts | nindent 12 }}
      volumes:
        {{- toYaml .Values.rbacSeedJob.volumes | nindent 8 }}
{{- end }}
