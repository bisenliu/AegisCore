{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegiscore-user-service.fullname" . }}
  labels:
    {{- include "aegiscore-user-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  podSelector:
    matchLabels:
      {{- include "aegiscore-user-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.nacos.server.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.nacos.server.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.nacos.server.port }}
    {{- with .Values.networkPolicy.additionalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
