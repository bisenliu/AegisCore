apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegiscore-user-service.fullname" . }}
  labels:
    {{- include "aegiscore-user-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "aegiscore-user-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
