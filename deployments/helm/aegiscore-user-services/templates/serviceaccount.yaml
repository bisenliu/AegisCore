{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegiscore-user-services.serviceAccountName" . }}
  labels:
    {{- include "aegiscore-user-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aegiscore-user-services.fullname" . }}
  labels:
    {{- include "aegiscore-user-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aegiscore-user-services.fullname" . }}
  labels:
    {{- include "aegiscore-user-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
subjects:
  - kind: ServiceAccount
    name: {{ include "aegiscore-user-services.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aegiscore-user-services.fullname" . }}
{{- end }}
