# 本文件是 aegiscore-user-services Helm chart 的默认 values。
# 适用于生产基线渲染，提供云厂商无关的 Deployment、RBAC seed Job、PDB、HPA 和 NetworkPolicy 配置。
# 敏感值只通过 `secret.existingSecret` 引用外部 Secret，默认不在 chart 中渲染真实 Secret。
replicaCount: 2 # 默认 HTTP 副本数；autoscaling.enabled=true 时由 HPA 控制。

image: # user-service 镜像配置，用于 HTTP Deployment 和 RBAC seed Job。
  repository: aegiscore-user-services # 镜像仓库地址；生产建议使用完整 registry 路径。
  tag: latest # 镜像 tag；生产建议替换为不可变 tag 或 digest。
  pullPolicy: IfNotPresent # 拉取策略；固定 tag 可用 IfNotPresent，浮动 tag 可改 Always。

imagePullSecrets: [] # 私有镜像仓库拉取凭据列表；为空表示不额外配置。
nameOverride: "" # 覆盖 chart name 片段；为空使用 Chart.yaml 中的 name。
fullnameOverride: "" # 覆盖完整资源名前缀；为空由 release 名称和 chart 名称生成。

serviceAccount: # Pod 运行身份配置。
  create: true # 是否由 chart 创建 ServiceAccount。
  automount: false # 是否自动挂载 Kubernetes API token；默认关闭以降低暴露面。
  annotations: {} # ServiceAccount 注解；可用于接入云厂商身份，但默认保持云无关。
  name: "" # 复用已有 ServiceAccount 时填写名称；为空则使用 chart fullname。

rbac: # namespace 级 RBAC 配置。
  create: true # 是否创建 Role 和 RoleBinding。
  rules: [] # 默认不授予 Kubernetes API 权限；需要时按最小权限追加规则。

podAnnotations: {} # 注入到 runtime Pod 的额外注解。
podLabels: {} # 注入到 runtime Pod 的额外标签。

podSecurityContext: # Pod 级安全上下文，适用于 Deployment 和 Job。
  runAsNonRoot: true # 要求容器以非 root 用户运行。
  runAsUser: 65532 # 容器进程 UID；与 Distroless nonroot 镜像身份一致。
  runAsGroup: 65532 # 容器进程 GID。
  fsGroup: 65532 # 挂载卷文件所属组，便于非 root 写入。
  seccompProfile: # seccomp 限制配置。
    type: RuntimeDefault # 使用容器运行时默认 seccomp profile。

securityContext: # 容器级安全上下文，适用于 runtime 和 Job 容器。
  allowPrivilegeEscalation: false # 禁止通过 setuid 等方式提权。
  readOnlyRootFilesystem: true # 根文件系统只读，临时写入使用 emptyDir。
  capabilities: # Linux capabilities 配置。
    drop: # 删除不需要的 capabilities。
      - ALL # 默认删除全部 capabilities，按需显式添加。

service: # runtime Service 配置。
  type: ClusterIP # Service 类型；默认只暴露集群内访问。
  port: 8080 # Service 和容器 HTTP 端口。

config: # 渲染到 ConfigMap 的非敏感 `AEGISCORE_*` 环境变量。
  TZ: Asia/Shanghai # 平台级进程时区，不属于 AegisCore 配置树。
  AEGISCORE_APP_ENVIRONMENT: production # 运行环境标识；生产类环境启用更严格校验。
  AEGISCORE_SERVER_HTTP_ENABLED: "true" # 启用 HTTP server。
  AEGISCORE_SERVER_HTTP_HOST: 0.0.0.0 # HTTP 监听地址。
  AEGISCORE_SERVER_HTTP_PORT: "8080" # HTTP 监听端口；需与 service.port 一致。
  AEGISCORE_SERVER_HTTP_READ_TIMEOUT: 30s # HTTP 读取超时。
  AEGISCORE_SERVER_HTTP_WRITE_TIMEOUT: 60s # HTTP 写入超时。
  AEGISCORE_SERVER_HTTP_IDLE_TIMEOUT: 120s # keep-alive 空闲超时。
  AEGISCORE_SERVER_HTTP_SHUTDOWN_TIMEOUT: 25s # HTTP 优雅关闭超时。
  AEGISCORE_SERVER_GRPC_ENABLED: "false" # 当前没有入站 gRPC API。
  AEGISCORE_SERVER_GRPC_HOST: 127.0.0.1 # gRPC 默认 loopback 监听地址。
  AEGISCORE_SERVER_GRPC_PORT: "9090" # gRPC 预留端口。
  AEGISCORE_SERVER_GRPC_SHUTDOWN_TIMEOUT: 10s # gRPC 优雅关闭超时。
  AEGISCORE_LOG_LEVEL: info # 日志级别；可选 debug、info、warn、error。
  AEGISCORE_LOG_FORMAT: json # 日志写 stdout/stderr，由平台采集和轮转。
  AEGISCORE_OBSERVABILITY_METRICS_ENABLED: "true" # 是否启用 Prometheus metrics endpoint。
  AEGISCORE_OBSERVABILITY_METRICS_PATH: /metrics # metrics 暴露路径。
  AEGISCORE_OBSERVABILITY_METRICS_INCLUDE_RUNTIME: "true" # 是否包含 Go runtime/process 指标。
  AEGISCORE_OBSERVABILITY_TRACING_ENABLED: "false" # 启用后固定使用 OTLP。
  AEGISCORE_OBSERVABILITY_TRACING_OTLP_ENDPOINT: "" # 启用 tracing 时填写 Collector endpoint。
  AEGISCORE_OBSERVABILITY_TRACING_INSECURE: "false" # 是否允许 insecure OTLP；生产建议 false。
  AEGISCORE_AUTH_JWT_ISSUER: aegiscore-user-services # JWT issuer。
  AEGISCORE_AUTH_JWT_AUDIENCE: aegiscore-users # JWT audience。
  AEGISCORE_RESOURCES_POSTGRES_USER_DB_HOST: postgres # user_db PostgreSQL 主机或 Service DNS。
  AEGISCORE_RESOURCES_POSTGRES_USER_DB_PORT: "5432" # user_db PostgreSQL 端口。
  AEGISCORE_RESOURCES_POSTGRES_USER_DB_DB_NAME: aegiscore_user # user_db 数据库名。
  AEGISCORE_RESOURCES_POSTGRES_USER_DB_SSLMODE: require # PostgreSQL SSL 模式。
  AEGISCORE_RESOURCES_POSTGRES_USER_DB_POOL_MAX_OPEN_CONNS: "50" # user_db 最大打开连接数。
  AEGISCORE_RESOURCES_POSTGRES_USER_DB_POOL_MAX_IDLE_CONNS: "10" # user_db 最大空闲连接数。
  AEGISCORE_RESOURCES_POSTGRES_USER_DB_POOL_CONN_MAX_LIFETIME: 30m # 单连接最大生命周期。
  AEGISCORE_RESOURCES_POSTGRES_USER_DB_POOL_CONN_MAX_IDLE_TIME: 10m # 空闲连接最大保留时间。
  AEGISCORE_RESOURCES_REDIS_CACHE_REDIS_ADDR: redis:6379 # cache_redis 地址。
  AEGISCORE_RESOURCES_REDIS_CACHE_REDIS_DB: "0" # Redis logical database 编号。
  AEGISCORE_RESOURCES_REDIS_CACHE_REDIS_TIMEOUT: 5s # Redis 建连、读写和启动探测统一超时。

secret: # 外部 Secret 引用配置；chart 不渲染真实 Secret。
  existingSecret: aegiscore-user-services-runtime # 已存在 Secret 名称。
  keys: # Secret 中各敏感字段的键名映射。
    jwtSecret: AEGISCORE_AUTH_JWT_SECRET # JWT HMAC secret。
    postgresUsername: AEGISCORE_RESOURCES_POSTGRES_USER_DB_USERNAME # user_db 用户名。
    postgresPassword: AEGISCORE_RESOURCES_POSTGRES_USER_DB_PASSWORD # user_db 密码。
    redisUsername: AEGISCORE_RESOURCES_REDIS_CACHE_REDIS_USERNAME # cache_redis ACL 用户名。
    redisPassword: AEGISCORE_RESOURCES_REDIS_CACHE_REDIS_PASSWORD # cache_redis 密码。

deployment: # runtime Deployment 行为配置。
  revisionHistoryLimit: 5 # 保留的历史 ReplicaSet 数量。
  minReadySeconds: 10 # Pod ready 后至少稳定多少秒才算可用。
  terminationGracePeriodSeconds: 35 # Pod 终止宽限期，应大于 HTTP shutdown_timeout。
  strategy: # rollout 策略。
    type: RollingUpdate # 使用滚动更新。
    rollingUpdate: # RollingUpdate 参数。
      maxUnavailable: 0 # 更新期间不主动减少可用副本。
      maxSurge: 1 # 更新期间最多额外创建 1 个 Pod。

probes: # HTTP 健康探针配置。
  liveness: # 存活探针；失败会重启容器。
    path: /livez # liveness 路径。
    periodSeconds: 10 # 探测周期。
    timeoutSeconds: 3 # 单次探测超时。
    failureThreshold: 3 # 连续失败阈值。
  readiness: # 就绪探针；失败会从 Service endpoints 移除。
    path: /readyz # readiness 路径。
    periodSeconds: 10 # 探测周期。
    timeoutSeconds: 3 # 单次探测超时。
    failureThreshold: 3 # 连续失败阈值。
  startup: # 启动探针；保护慢启动容器。
    path: /startupz # startup 路径。
    periodSeconds: 5 # 启动期间探测周期。
    timeoutSeconds: 3 # 单次探测超时。
    failureThreshold: 24 # 启动失败阈值，约 120 秒窗口。

resources: # runtime 容器资源边界。
  requests: # 调度和 HPA 计算使用的资源请求。
    cpu: 100m # 请求 0.1 CPU。
    memory: 128Mi # 请求 128Mi 内存。
  limits: # 容器资源上限。
    cpu: 500m # 限制最多 0.5 CPU。
    memory: 512Mi # 限制最多 512Mi 内存。

volumeMounts: # runtime 容器挂载卷。
  - name: tmp # 临时卷名称。
    mountPath: /tmp # 可写临时目录。
volumes: # runtime Pod 卷定义。
  - name: tmp # 临时卷名称。
    emptyDir: # Pod 生命周期内的临时目录。
      sizeLimit: 256Mi # 临时目录容量上限。

autoscaling: # HPA 配置。
  enabled: true # 是否渲染 HorizontalPodAutoscaler。
  minReplicas: 2 # 最小副本数。
  maxReplicas: 6 # 最大副本数。
  targetCPUUtilizationPercentage: 70 # CPU 平均利用率目标。
  targetMemoryUtilizationPercentage: 80 # 内存平均利用率目标。

pdb: # PodDisruptionBudget 配置。
  enabled: true # 是否渲染 PDB。
  maxUnavailable: 1 # 自愿驱逐时最多允许 1 个 Pod 不可用。

networkPolicy: # NetworkPolicy 配置。
  enabled: true # 是否渲染网络策略；需 CNI 支持策略执行。
  ingress: # 入站允许规则。
    - from: # 允许访问 user-service 的来源。
        - namespaceSelector: # 仅允许受信任入口 namespace。
            matchLabels: # namespace 标签条件。
              kubernetes.io/metadata.name: ingress-system # 网关或受控上游所在 namespace。
          podSelector: # 来源 Pod 选择器。
            matchLabels: # 调用方需显式打上准入标签。
              aegiscore.io/allow-user-service: "true" # 允许访问 user-service 的来源标签。
      ports: # 入站允许端口。
        - protocol: TCP # HTTP 使用 TCP。
          port: 8080 # user-service HTTP 端口。
  egress: # 出站允许规则。
    - to: # PostgreSQL 目的地限制。
        - namespaceSelector: # 选择数据库所在 namespace。
            matchLabels: # namespace 标签条件。
              kubernetes.io/metadata.name: data-services # 数据服务 namespace。
          podSelector: # 选择 PostgreSQL Pod。
            matchLabels: # Pod 标签条件。
              app.kubernetes.io/name: postgres # PostgreSQL 工作负载标签。
      ports: # PostgreSQL 允许端口。
        - protocol: TCP # PostgreSQL 使用 TCP。
          port: 5432 # PostgreSQL 端口。
    - to: # Redis 目的地限制。
        - namespaceSelector: # 选择缓存所在 namespace。
            matchLabels: # namespace 标签条件。
              kubernetes.io/metadata.name: data-services # 数据服务 namespace。
          podSelector: # 选择 Redis Pod。
            matchLabels: # Pod 标签条件。
              app.kubernetes.io/name: redis # Redis 工作负载标签。
      ports: # Redis 允许端口。
        - protocol: TCP # Redis 使用 TCP。
          port: 6379 # Redis 端口。
    - to: # OTLP Collector 目的地限制。
        - namespaceSelector: # 选择观测组件所在 namespace。
            matchLabels: # namespace 标签条件。
              kubernetes.io/metadata.name: observability # 观测 namespace。
          podSelector: # 选择 OpenTelemetry Collector Pod。
            matchLabels: # Pod 标签条件。
              app.kubernetes.io/name: opentelemetry-collector # Collector 工作负载标签。
      ports: # OTLP 允许端口。
        - protocol: TCP # OTLP gRPC 使用 TCP。
          port: 4317 # OTLP gRPC 端口。
        - protocol: TCP # OTLP HTTP 使用 TCP。
          port: 4318 # OTLP HTTP 端口。
    - to: # DNS 目的地限制。
        - namespaceSelector: # 选择 DNS 所在 namespace。
            matchLabels: # namespace 标签条件。
              kubernetes.io/metadata.name: kube-system # CoreDNS 通常位于 kube-system。
      ports: # DNS 允许端口。
        - protocol: UDP # DNS 常用 UDP。
          port: 53 # DNS UDP 端口。
        - protocol: TCP # DNS 大响应或重试可用 TCP。
          port: 53 # DNS TCP 端口。

rbacSeedJob: # RBAC 系统数据 seed 发布前置 Job 配置。
  enabled: true # 是否渲染 RBAC seed Job。
  nameSuffix: rbac-seed # Job 名称后缀。
  backoffLimit: 3 # 失败重试次数上限。
  activeDeadlineSeconds: 900 # Job 最大运行时间。
  ttlSecondsAfterFinished: 86400 # Job 完成后保留时间。
  command: # RBAC seed 容器命令。
    - /app/user-service/bin/user-services # user-service 二进制路径。
    - rbac # 进入 RBAC CLI。
    - --config # 指定配置文件参数名。
    - /app/user-service/configs/config.yaml # 镜像内配置文件路径。
    - seed # 执行 RBAC seed。
    - --reactivate-system # 重新启用 catalog 管理的系统角色和权限。
    - --sync-system-bindings # 同步系统角色权限绑定。
  resources: # seed 容器资源边界。
    requests: # 调度使用的资源请求。
      cpu: 100m # 请求 0.1 CPU。
      memory: 128Mi # 请求 128Mi 内存。
    limits: # 容器资源上限。
      cpu: 500m # 限制最多 0.5 CPU。
      memory: 512Mi # 限制最多 512Mi 内存。
  volumeMounts: # seed 容器挂载卷。
    - name: tmp # 临时卷名称。
      mountPath: /tmp # 可写临时目录。
  volumes: # seed Pod 卷定义。
    - name: tmp # 临时卷名称。
      emptyDir: # Pod 生命周期内临时目录。
        sizeLimit: 128Mi # 临时目录容量上限。

nodeSelector: {} # Pod 节点选择器；按环境需要约束调度节点。
tolerations: [] # Pod tolerations；按环境需要容忍节点 taint。
affinity: {} # Pod affinity/anti-affinity；按环境需要设置亲和性。
topologySpreadConstraints: [] # 拓扑分布约束；按环境需要跨可用区或节点分散副本。
