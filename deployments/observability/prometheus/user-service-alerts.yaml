groups:
  - name: aegiscore-user-service.rules
    rules:
      - alert: AegisCoreUserServiceHigh5xxRatio
        expr: |
          (
            sum(rate(http_server_requests_total{service="aegiscore-user-service",status_class="5xx"}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_total{service="aegiscore-user-service"}[5m])), 1)
          ) > 0.05
        for: 10m
        labels:
          service: aegiscore-user-service
          severity: critical
        annotations:
          summary: "用户服务 5xx 比例超过 5%"
          description: "用户服务 HTTP 请求中超过 5% 在最近 10 分钟返回 5xx。请查看 HTTP RED dashboard，并通过 trace_id 关联错误日志。"
          runbook_url: "docs/observability/user-service-runbook.md#http-5xx-ratio"

      - alert: AegisCoreUserServiceHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_server_request_duration_seconds_bucket{service="aegiscore-user-service"}[5m])
            )
          ) > 1
        for: 10m
        labels:
          service: aegiscore-user-service
          severity: warning
        annotations:
          summary: "用户服务 P95 延迟超过 1 秒"
          description: "HTTP server P95 延迟已连续 10 分钟超过 1 秒。请检查 route 级延迟、依赖面板和最近 deployment 变更。"
          runbook_url: "docs/observability/user-service-runbook.md#http-latency"

      - alert: AegisCoreUserServiceReadyzFailure
        expr: |
          probe_success{job=~".*readyz.*"} == 0
        for: 5m
        labels:
          service: aegiscore-user-service
          severity: critical
        annotations:
          summary: "用户服务 readyz 探测失败"
          description: "外部 readyz 探测已连续 5 分钟失败。该规则需要 blackbox exporter、Kubernetes probe metrics 或等价外部探测。"
          runbook_url: "docs/observability/user-service-runbook.md#readiness-failure"

      - alert: AegisCoreUserServiceHighGoroutineCount
        expr: |
          max by (service, environment, instance) (
            go_goroutines{service="aegiscore-user-service"}
          ) > 10000
        for: 5m
        labels:
          service: aegiscore-user-service
          severity: warning
        annotations:
          summary: "用户服务 goroutine 数量过高"
          description: "实例 {{ $labels.instance }} 的 goroutine 数量已连续 5 分钟超过 10000，可能存在 goroutine 泄漏或突发并发堆积。请检查 Go runtime dashboard、pprof goroutine profile 和近期发布变更。"
          runbook_url: "docs/observability/user-service-runbook.md#goroutine-count"

      - alert: AegisCoreUserServicePostgresPoolUnavailable
        expr: |
          absent(aegiscore_postgres_pool_open_connections{service="aegiscore-user-service",resource="primary_db"})
        for: 5m
        labels:
          service: aegiscore-user-service
          severity: critical
        annotations:
          summary: "用户服务 PostgreSQL pool 可能不可用"
          description: "primary_db PostgreSQL pool 指标缺失。请检查 readyz、数据库连通性和 primary_db pool 配置。"
          runbook_url: "docs/observability/user-service-runbook.md#postgresql-unavailable-or-pool-pressure"

      - alert: AegisCoreUserServicePostgresPoolWaitPressure
        expr: |
          rate(aegiscore_postgres_pool_wait_count_total{service="aegiscore-user-service",resource="primary_db"}[5m]) > 0
        for: 10m
        labels:
          service: aegiscore-user-service
          severity: warning
        annotations:
          summary: "用户服务 PostgreSQL pool 持续等待连接"
          description: "primary_db pool 已连续 10 分钟出现连接等待。请检查 in-use/open connections、慢请求和数据库容量。"
          runbook_url: "docs/observability/user-service-runbook.md#postgresql-unavailable-or-pool-pressure"

      - alert: AegisCoreUserServiceRedisUnavailable
        expr: |
          aegiscore_redis_up{service="aegiscore-user-service",resource="cache_redis"} == 0
        for: 5m
        labels:
          service: aegiscore-user-service
          severity: critical
        annotations:
          summary: "用户服务 Redis cache_redis 不可用"
          description: "cache_redis 的 Redis ping 已连续 5 分钟失败。请检查 Redis 可用性、网络路径和 readyz。"
          runbook_url: "docs/observability/user-service-runbook.md#redis-unavailable"

      - alert: AegisCoreUserServiceLocalcacheLoadErrors
        expr: |
          sum by (cache) (
            increase(aegiscore_localcache_loads_total{service="aegiscore-user-service",result="error"}[10m])
          ) > 0
        for: 0m
        labels:
          service: aegiscore-user-service
          severity: warning
        annotations:
          summary: "用户服务 localcache 回源失败"
          description: "localcache {{ $labels.cache }} 最近 10 分钟出现 loader error。请检查回源依赖、缓存注册状态和对应 feature 日志。"
          runbook_url: "docs/observability/user-service-runbook.md#localcache-load-errors"

      - alert: AegisCoreUserServiceLocalcacheCapacityEvictionPressure
        expr: |
          sum by (cache) (
            increase(aegiscore_localcache_capacity_evictions_total{service="aegiscore-user-service"}[15m])
          )
          /
          clamp_min(
            max by (cache) (aegiscore_localcache_capacity{service="aegiscore-user-service"}),
            1
          ) > 0.2
        for: 15m
        labels:
          service: aegiscore-user-service
          severity: warning
        annotations:
          summary: "用户服务 localcache 容量驱逐压力升高"
          description: "localcache {{ $labels.cache }} 最近 15 分钟容量驱逐增量超过容量预算的 20%。请检查容量、key 基数和缓存命中率。TTL 到期与显式失效不计入该指标。"
          runbook_url: "docs/observability/user-service-runbook.md#localcache-capacity-eviction-pressure"

      - alert: AegisCoreUserServiceRBACWatcherStopped
        expr: |
          aegiscore_user_service_rbac_policy_watcher_running{service="aegiscore-user-service"} == 0
        for: 5m
        labels:
          service: aegiscore-user-service
          severity: critical
        annotations:
          summary: "RBAC policy watcher 已停止"
          description: "RBAC policy watcher 已连续 5 分钟报告 stopped。Policy 更新可能无法在副本之间传播。"
          runbook_url: "docs/observability/user-service-runbook.md#rbac-watcher-stopped"

      - alert: AegisCoreUserServiceRBACWatcherStale
        expr: |
          (
            aegiscore_user_service_rbac_policy_watcher_reconcile_staleness_seconds{service="aegiscore-user-service"}
            >
            aegiscore_user_service_rbac_policy_watcher_max_staleness_seconds{service="aegiscore-user-service"}
          )
          or
          (
            aegiscore_user_service_rbac_policy_watcher_running{service="aegiscore-user-service"} == 1
            and
            aegiscore_user_service_rbac_policy_watcher_last_reconcile_success_timestamp_seconds{service="aegiscore-user-service"} == 0
          )
        for: 1m
        labels:
          service: aegiscore-user-service
          severity: critical
        annotations:
          summary: "RBAC policy watcher 权威校准已过期"
          description: "实例 {{ $labels.instance }} 的 RBAC policy watcher 从未完成权威校准，或校准 staleness 已持续超过该实例配置预算。"
          runbook_url: "docs/observability/user-service-runbook.md#rbac-watcher-stale"

      - alert: AegisCoreUserServiceRBACWatcherReconnecting
        expr: |
          aegiscore_user_service_rbac_policy_watcher_subscription_state{service="aegiscore-user-service",state="reconnecting"} == 1
          and on (service, environment, instance)
          increase(aegiscore_user_service_rbac_policy_watcher_reconnect_attempts_total{service="aegiscore-user-service"}[5m]) > 0
        for: 5m
        labels:
          service: aegiscore-user-service
          severity: warning
        annotations:
          summary: "RBAC policy watcher 持续重连"
          description: "实例 {{ $labels.instance }} 的 RBAC Pub/Sub subscription 已持续重连 5 分钟；权威数据库校准仍独立运行。"
          runbook_url: "docs/observability/user-service-runbook.md#rbac-watcher-reconnecting"

      - alert: AegisCoreUserServicePolicyReloadFailed
        expr: |
          increase(aegiscore_casbin_policy_reloads_total{service="aegiscore-user-service",status="failure"}[10m]) > 0
        for: 0m
        labels:
          service: aegiscore-user-service
          severity: critical
        annotations:
          summary: "Casbin policy reload 失败"
          description: "最近 10 分钟至少发生一次 Casbin policy reload 失败。请检查 policy reload 日志和 RBAC datastore 健康状态。"
          runbook_url: "docs/observability/user-service-runbook.md#casbin-policy-reload-failed"

      - alert: AegisCoreUserServiceRBACPolicyReloadLag
        expr: |
          max by (service, environment, instance) (
            aegiscore_user_service_rbac_policy_reload_lag{service="aegiscore-user-service"}
          ) > 0
        for: 30s
        labels:
          service: aegiscore-user-service
          severity: warning
        annotations:
          summary: "RBAC policy reload lag 持续存在"
          description: "实例 {{ $labels.instance }} 的本地 Casbin applied projection revision 落后最近成功读取的数据库 latest policy revision 已持续超过 30 秒，权限变更可能尚未最终生效。"
          runbook_url: "docs/observability/user-service-runbook.md#rbac-policy-reload-lag"

      - alert: AegisCoreUserServiceRBACRevisionStoreUnavailable
        expr: |
          increase(aegiscore_user_service_rbac_policy_sync_operations_total{service="aegiscore-user-service",operation="watcher_revision_check",result="failure",reason="revision_store_unavailable"}[5m]) > 0
        for: 0m
        labels:
          service: aegiscore-user-service
          severity: critical
        annotations:
          summary: "RBAC 数据库 policy revision 查询失败"
          description: "RBAC watcher 最近 5 分钟无法读取数据库 latest policy revision。Pub/Sub hint 和 Redis counter 不会作为补偿权威值，当前 lag gauge 可能保留上一次成功校准结果。"
          runbook_url: "docs/observability/user-service-runbook.md#rbac-policy-reload-lag"

      - alert: AegisCoreUserServiceWorkerpoolFailedOrPanicked
        expr: |
          increase(aegiscore_workerpool_tasks_total{service="aegiscore-user-service",pool="auth_session_purge_pool",event=~"failed|panicked"}[10m]) > 0
        for: 0m
        labels:
          service: aegiscore-user-service
          severity: warning
        annotations:
          summary: "Auth session purge workerpool task 失败或 panic"
          description: "auth session purge workerpool 最近 10 分钟报告 failed 或 panicked task。请检查 Redis 健康状态和 workerpool 日志。"
          runbook_url: "docs/observability/user-service-runbook.md#workerpool-failed-or-panicked"

      - alert: AegisCoreUserServicePasswordChangeRevocationFailed
        expr: |
          increase(aegiscore_user_service_auth_password_change_revocation_projection_failures_total{service="aegiscore-user-service"}[10m]) > 0
          or
          increase(aegiscore_user_service_auth_password_change_revocation_compensation_failures_total{service="aegiscore-user-service"}[10m]) > 0
        for: 0m
        labels:
          service: aegiscore-user-service
          severity: critical
        annotations:
          summary: "强制改密安全撤销失败"
          description: "强制改密成功更新凭据后，token version 投影、refresh session 删除或撤销补偿失败。请优先检查 Redis、auth token version 投影、本地缓存失效和 refresh session 删除链路。"
          runbook_url: "docs/observability/user-service-runbook.md#password-change-revocation-failed"

      - alert: AegisCoreUserServiceSchedulerJobFailed
        expr: |
          increase(aegiscore_scheduler_jobs_total{service="aegiscore-user-service",event="failed"}[10m]) > 0
        for: 0m
        labels:
          service: aegiscore-user-service
          severity: warning
        annotations:
          summary: "用户服务 scheduler job 失败"
          description: "最近 10 分钟至少有一个 scheduler job 失败。请检查 `scheduler_job` label、scheduler dashboard 和失败 scheduler job 的日志。"
          runbook_url: "docs/observability/user-service-runbook.md#scheduler-job-failed"

      - alert: AegisCoreUserServiceSchedulerLockRenewFailed
        expr: |
          increase(aegiscore_scheduler_jobs_total{service="aegiscore-user-service",event="lock_renew_failed"}[10m]) > 0
        for: 0m
        labels:
          service: aegiscore-user-service
          severity: warning
        annotations:
          summary: "用户服务 scheduler lock 续租失败"
          description: "最近 10 分钟至少有一个 scheduler job 报告 lock renewal failure。请检查 Redis lock 连通性和长时间运行的 scheduler job。"
          runbook_url: "docs/observability/user-service-runbook.md#scheduler-job-failed"
